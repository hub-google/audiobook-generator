name: "系統測試｜程式、網站與封面"
run-name: "【系統測試】程式與網站｜第 ${{ github.run_number }} 次"
on:
  push:
    branches:
      - main
  workflow_dispatch:
concurrency:
  group: audio-web-ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  regression:
    name: "程式回歸測試"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip}
      - name: "安裝程式與測試套件"
        run: pip install -r requirements.txt pytest playwright
      - name: "檢查 Python 語法"
        run: python -m compileall -q src tools gui_components
      - name: "檢查網頁 JavaScript 語法"
        run: node --check docs/site/app.js && node --check docs/site/novel-search.js && node --check docs/site/bridge.js && node --check docs/site/cleaner-parity.js && node --check docs/site/review-inspector.js && node --check docs/site/manual-cover.js && node --check docs/site/batch-cover.js
      - name: "實測免登入的 AUDIO 操作服務（無帳號、無 Token）"
        run: |
          python - <<'PY'
          from pathlib import Path
          import requests
          site = Path("docs/site/index.html").read_text(encoding="utf-8")
          assert 'type="password"' not in site, "網站不應顯示登入密碼欄"
          assert 'id="github-token"' not in site, "網站不應要求 GitHub PAT"
          endpoint = "https://unapiwajmgqqtdkixaab.supabase.co/functions/v1/audio-web-commands/status"
          response = requests.get(endpoint, headers={"Origin": "https://hub-google.github.io"}, timeout=30)
          assert response.status_code == 200, "免登入狀態服務 HTTP " + str(response.status_code)
          assert response.headers.get("Access-Control-Allow-Origin") == "https://hub-google.github.io"
          assert isinstance(response.json().get("requests"), list), "操作服務沒有回傳任務陣列"
          print("AUDIO no-login live endpoint: PASS")
          PY
      - name: "安裝桌面畫面測試環境"
        run: sudo apt-get update -qq && sudo apt-get install -y xvfb
      - name: "執行完整回歸測試"
        run: xvfb-run -a python -m pytest -q tests
  ui-smoke:
    name: "桌面與手機網頁驗收"
    # UI screenshots are valuable even if unrelated backend tests fail.
    if: ${{ always() && !cancelled() }}
    needs: regression
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: "安裝瀏覽器驅動及測試封面圖片套件"
        run: pip install playwright Pillow
      - name: "安裝繁體中文字型，確保驗收截圖可閱讀"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          fc-match -f "%{family}\n" "Noto Sans CJK TC" | grep -q "Noto Sans CJK"
      - name: "檢查電腦與手機網頁"
        run: python -m tools.verify_audio_web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audio-web-ui-screenshots
          path: ui-test-screenshots/*.png
          if-no-files-found: warn
          retention-days: 7
  cover-live-probe:
    name: "封面服務連線實測"
    if: github.event_name == 'workflow_dispatch'
    needs: regression
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip}
      - run: pip install -r requirements.txt
      - name: "實際測試 Cloudflare 免費封面生成"
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_IMAGE_MODEL: gemini-2.5-flash-image
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_WORKERS_FREE_CONFIRMED: ${{ vars.CLOUDFLARE_WORKERS_FREE_CONFIRMED }}
          COVER_IMAGE_PROVIDER: cloudflare
        run: python -m tools.cover_provider_probe
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: cloudflare-cover-probe
          path: cloudflare-cover-probe.jpg
          if-no-files-found: ignore
