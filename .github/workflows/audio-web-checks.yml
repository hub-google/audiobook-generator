name: "系統測試｜程式、網站與封面"
run-name: "【系統測試】程式與網站｜第 ${{ github.run_number }} 次"
on:
  push:
    branches:
      - main
  workflow_dispatch:
concurrency:
  group: audio-web-ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  regression:
    name: "程式回歸測試"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip}
      - name: "安裝程式與測試套件"
        run: pip install -r requirements.txt pytest playwright
      - name: "檢查 Python 語法"
        run: python -m compileall -q src tools gui_components
      - name: "檢查網頁 JavaScript 語法"
        run: node --check docs/site/app.js
      - name: "安裝桌面畫面測試環境"
        run: sudo apt-get update -qq && sudo apt-get install -y xvfb
      - name: "執行完整回歸測試"
        run: xvfb-run -a python -m pytest -q tests
  ui-smoke:
    name: "桌面與手機網頁驗收"
    needs: regression
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: "安裝瀏覽器驅動"
        run: pip install playwright
      - name: "檢查電腦與手機網頁"
        run: python -m tools.verify_audio_web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audio-web-ui-screenshots
          path: ui-test-screenshots/*.png
          if-no-files-found: warn
          retention-days: 7
  cover-live-probe:
    name: "封面服務連線實測"
    if: github.event_name == 'workflow_dispatch'
    needs: regression
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip}
      - run: pip install -r requirements.txt
      - name: "實際測試封面生成（HF 失敗時改用 Gemini）"
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_IMAGE_MODEL: gemini-2.5-flash-image
        run: python -m tools.cover_provider_probe
