name: AUDIO Web and Sources CI
on:
  push:
    branches:
      - main
  workflow_dispatch:
concurrency:
  group: audio-web-ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip}
      - name: Install runtime and tests
        run: pip install -r requirements.txt pytest playwright
      - name: Python syntax
        run: python -m compileall -q src tools gui_components
      - name: Browser JavaScript syntax
        run: node --check docs/site/app.js
      - name: Install virtual display for desktop compatibility tests
        run: sudo apt-get update -qq && sudo apt-get install -y xvfb
      - name: Complete regression tests
        run: xvfb-run -a python -m pytest -q tests
  ui-smoke:
    needs: regression
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install browser driver
        run: pip install playwright
      - name: Verify desktop and mobile web console
        run: python -m tools.verify_audio_web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audio-web-ui-screenshots
          path: ui-test-screenshots/*.png
          if-no-files-found: warn
          retention-days: 7
  cover-live-probe:
    if: github.event_name == 'workflow_dispatch'
    needs: regression
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip}
      - run: pip install -r requirements.txt
      - name: Request actual HF cover; try Gemini if unavailable
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_IMAGE_MODEL: gemini-2.5-flash-image
        run: python -m tools.cover_provider_probe

  one-time-history-tidy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      actions: write
    steps:
      - name: Delete completed runs belonging to retired workflows
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for id in 45921122220 45521207368; do
            state="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id" --jq .status 2>&1)" || {
              if [[ "$state" == *"HTTP 404"* ]]; then continue; fi
              echo "Failed to read run $id: $state" >&2; exit 1
            }
            if [ "$state" != completed ]; then
              echo "Run $id is not completed: $state" >&2
              exit 1
            fi
            done_delete=false
            for retry in 1 2 3 4 5; do
              if gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$id" >/dev/null; then
                done_delete=true
                echo "Removed retired workflow run $id"
                break
              fi
              sleep "$((retry*2))"
            done
            [ "$done_delete" = true ] || exit 1
          done
