name: "系統測試｜程式、網站與封面"
run-name: "【系統測試】程式與網站｜第 ${{ github.run_number }} 次"
on:
  push:
    branches:
      - main
  workflow_dispatch:
concurrency:
  group: audio-web-ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  regression:
    name: "程式回歸測試"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip}
      - name: "安裝程式與測試套件"
        run: pip install -r requirements.txt pytest playwright
      - name: "檢查 Python 語法"
        run: python -m compileall -q src tools gui_components
      - name: "檢查網頁 JavaScript 語法"
        run: node --check docs/site/app.js && node --check docs/site/novel-search.js && node --check docs/site/bridge.js && node --check docs/site/cleaner-parity.js && node --check docs/site/review-inspector.js && node --check docs/site/manual-cover.js && node --check docs/site/batch-cover.js
      - name: "安裝桌面畫面測試環境"
        run: sudo apt-get update -qq && sudo apt-get install -y xvfb
      - name: "執行完整回歸測試"
        run: xvfb-run -a python -m pytest -q tests
  ui-smoke:
    name: "桌面與手機網頁驗收"
    needs: regression
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: "安裝瀏覽器驅動及測試封面圖片套件"
        run: pip install playwright Pillow
      - name: "安裝繁體中文字型，確保驗收截圖可閱讀"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          fc-match -f "%{family}\n" "Noto Sans CJK TC" | grep -q "Noto Sans CJK"
      - name: "檢查電腦與手機網頁"
        run: python -m tools.verify_audio_web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audio-web-ui-screenshots
          path: ui-test-screenshots/*.png
          if-no-files-found: warn
          retention-days: 7
  cover-live-probe:
    name: "封面服務連線實測"
    if: github.event_name == 'workflow_dispatch'
    needs: regression
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip}
      - run: pip install -r requirements.txt
      - name: "實際測試封面生成（依已設定的服務）"
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_IMAGE_MODEL: gemini-2.5-flash-image
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_WORKERS_FREE_CONFIRMED: ${{ vars.CLOUDFLARE_WORKERS_FREE_CONFIRMED }}
          COVER_IMAGE_PROVIDER: ${{ vars.COVER_IMAGE_PROVIDER || 'auto' }}
        run: python -m tools.cover_provider_probe
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: cloudflare-cover-probe
          path: cloudflare-cover-probe.jpg
          if-no-files-found: ignore
