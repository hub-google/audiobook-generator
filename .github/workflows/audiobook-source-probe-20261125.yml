name: AUDIO｜來源正文連線診斷
on:
  push:
    branches: [master]
    paths: ['.github/workflows/audiobook-source-probe-20261125.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests curl_cffi
      - name: Test mirror hosts and client profiles with actual first-chapter response
        shell: bash
        run: |
          python - <<'PY'
          import requests,time
          from curl_cffi import requests as curl
          urls=[
             "https://www.17moon.com/book/JFM/Gup4.html",
             "https://www.20moon.com/book/JFM/Gup4.html",
             "https://twkan.com/txt/29813/22352960",
          ]
          for url in urls:
              for kind in ("requests-browser-ua","curl-chrome"):
                  start=time.monotonic()
                  try:
                      if kind=="curl-chrome":
                          x=curl.get(url,impersonate="chrome120",timeout=18)
                      else:
                          x=requests.get(url,timeout=18,headers={"User-Agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120.0.0.0 Safari/537.36"})
                      text=x.text
                      valid=(x.status_code==200 and len(text)>2000 and ("聖女收徒" in text or "陸仁" in text))
                      print(f"RESULT {kind} {url} status={x.status_code} body_len={len(x.content)} validated={valid} elapsed={time.monotonic()-start:.1f}s",flush=True)
                  except Exception as e:
                      print(f"ERROR {kind} {url} {repr(e)} elapsed={time.monotonic()-start:.1f}s",flush=True)
          PY
