name: Merge one run into one YouTube video

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Source Actions run URL or numeric ID"
        required: true
        type: string
      privacy:
        description: "Initial YouTube privacy"
        required: true
        default: private
        type: choice
        options:
          - private
          - unlisted
          - public
      checkpoint_repo:
        description: "HF dataset repo for checkpoints (blank = auto-create)"
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: merge-run-upload-${{ inputs.source_run_id }}
  cancel-in-progress: false

jobs:
  discover_workers:
    name: Discover source worker artifacts
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.workers.outputs.matrix }}
      count: ${{ steps.workers.outputs.count }}
    steps:
      - name: Build numeric worker matrix
        id: workers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          run_id=$(printf '%s' "$SOURCE_RUN_ID" | sed -E 's#^.*/actions/runs/([0-9]+)/?.*$#\1#')
          if ! [[ "$run_id" =~ ^[0-9]+$ ]]; then
            echo "Invalid source run ID or URL: $SOURCE_RUN_ID" >&2
            exit 1
          fi
          names=$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired == false) | .name' \
            | grep -E '^mp4-worker-[0-9]+$' \
            | sort -t- -k3,3n)
          if [ -z "$names" ]; then
            echo "No non-expired mp4-worker-* artifacts found in source run $run_id" >&2
            exit 1
          fi
          matrix=$(printf '%s\n' "$names" | jq -Rsc 'split("\n") | map(select(length > 0) | {worker_name: .}) | {include: .}')
          count=$(printf '%s\n' "$names" | grep -c .)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "## Parallel worker plan" >> "$GITHUB_STEP_SUMMARY"
          echo "- Workers discovered: **$count**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Maximum simultaneous runners: **15**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Worker order: **$(printf '%s' "$names" | paste -sd ', ' -)**" >> "$GITHUB_STEP_SUMMARY"

  stage_workers:
    name: "Stage ${{ matrix.worker_name }}"
    needs: discover_workers
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 15
      matrix: ${{ fromJSON(needs.discover_workers.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install worker dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download, merge, and checkpoint this worker
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          CHECKPOINT_REPO: ${{ inputs.checkpoint_repo }}
          WORKER_NAME: ${{ matrix.worker_name }}
        run: |
          python "合併上傳/merge_upload.py" \
            --work-dir "merge-worker-state/$WORKER_NAME" \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$SOURCE_RUN_ID" \
            --checkpoint-repo "$CHECKPOINT_REPO" \
            --worker-name "$WORKER_NAME"

      - name: Write worker summary
        if: always()
        env:
          WORKER_NAME: ${{ matrix.worker_name }}
        run: |
          state="merge-worker-state/$WORKER_NAME/state.json"
          echo "## $WORKER_NAME" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$state" ]; then
            echo "- Status: **$(jq -r '.status' "$state")**" >> "$GITHUB_STEP_SUMMARY"
            echo "- Last stage: **$(jq -r '.current_stage' "$state")**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Status: **FAILED before state initialization**" >> "$GITHUB_STEP_SUMMARY"
          fi

  merge_and_upload:
    name: Final merge and one YouTube upload
    needs: [discover_workers, stage_workers]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-cjk
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Checkpoint, merge in chapter order, and upload one video
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          YOUTUBE_PRIVACY: ${{ inputs.privacy }}
          CHECKPOINT_REPO: ${{ inputs.checkpoint_repo }}
        run: |
          python "合併上傳/merge_upload.py" \
            --work-dir merge-upload-state \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$SOURCE_RUN_ID" \
            --privacy "$YOUTUBE_PRIVACY" \
            --checkpoint-repo "$CHECKPOINT_REPO"

      - name: Write result summary
        if: always()
        run: |
          echo "## Single-file merge/upload attempt" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source run: **${{ inputs.source_run_id }}**" >> "$GITHUB_STEP_SUMMARY"
          if [ -f merge-upload-state/state.json ]; then
            status=$(jq -r '.status' merge-upload-state/state.json)
            stage=$(jq -r '.current_stage' merge-upload-state/state.json)
            workers=$(jq -r '(.completed_workers // []) | length' merge-upload-state/state.json)
            total=$(jq -r '.artifact_count // "unknown"' merge-upload-state/state.json)
            worker_names=$(jq -r '(.completed_workers // []) | if length == 0 then "none" else join(", ") end' merge-upload-state/state.json)
            downloaded_names=$(jq -r '(.downloaded_worker_chunks // []) | if length == 0 then "none" else join(", ") end' merge-upload-state/state.json)
            merged=$(jq -r 'if .final_merge_complete == true then "YES" else "NO" end' merge-upload-state/state.json)
            cleanup=$(jq -r '.cleanup_status // "not started (video upload did not complete)"' merge-upload-state/state.json)
            echo "- Status: **$status**" >> "$GITHUB_STEP_SUMMARY"
            echo "- Last stage: **$stage**" >> "$GITHUB_STEP_SUMMARY"
            echo "- Worker checkpoints: **$workers / $total**" >> "$GITHUB_STEP_SUMMARY"
            echo "- Worker checkpoints completed: **$worker_names**" >> "$GITHUB_STEP_SUMMARY"
            echo "- Worker chunks downloaded for final merge: **$downloaded_names**" >> "$GITHUB_STEP_SUMMARY"
            echo "- Final merge completed and saved: **$merged**" >> "$GITHUB_STEP_SUMMARY"
            echo "- HF large-file cleanup: **$cleanup**" >> "$GITHUB_STEP_SUMMARY"
            echo "- HF video checkpoints deleted: **$(jq -r '.cleanup_deleted_count // 0' merge-upload-state/state.json)**" >> "$GITHUB_STEP_SUMMARY"
            echo "- HF LFS objects submitted for permanent reclamation: **$(jq -r '.cleanup_reclaimed_lfs_count // 0' merge-upload-state/state.json)**" >> "$GITHUB_STEP_SUMMARY"
            echo "- HF checkpoint repo: **$(jq -r '.checkpoint_repo' merge-upload-state/state.json)**" >> "$GITHUB_STEP_SUMMARY"
            if [ "$status" = complete ]; then
              url=$(jq -r '.video_url' merge-upload-state/state.json)
              echo "- YouTube: [$url]($url)" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "### Failure detail" >> "$GITHUB_STEP_SUMMARY"
              echo "- Failed stage: **$stage**" >> "$GITHUB_STEP_SUMMARY"
              echo "- Error type: **$(jq -r '.error.type // "UnknownError"' merge-upload-state/state.json)**" >> "$GITHUB_STEP_SUMMARY"
              echo "- Message: $(jq -r '.error.message // "No error detail was recorded"' merge-upload-state/state.json)" >> "$GITHUB_STEP_SUMMARY"
              echo "- Resume: rerun with the same source run ID and checkpoint repo." >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "- Status file missing: failure occurred before checkpoint initialization." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Preserve manifest and result
        if: always() && hashFiles('merge-upload-state/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: merge-upload-state-${{ inputs.source_run_id }}
          path: merge-upload-state/
          if-no-files-found: ignore
