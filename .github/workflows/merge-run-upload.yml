name: Merge one run into one YouTube video

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Source Actions run URL or numeric ID"
        required: true
        type: string
      privacy:
        description: "Initial YouTube privacy"
        required: true
        default: private
        type: choice
        options: [private, unlisted, public]
      checkpoint_repo:
        description: "HF Storage Bucket (blank = auto-create)"
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: merge-run-upload-${{ inputs.source_run_id }}
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      count: ${{ steps.workers.outputs.count }}
      run_id: ${{ steps.workers.outputs.run_id }}
      bucket: ${{ steps.bucket.outputs.bucket }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "huggingface_hub>=1.6.0"
      - name: Create or reuse public HF Storage Bucket
        id: bucket
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          REQUESTED_BUCKET: ${{ inputs.checkpoint_repo }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi, create_bucket
          requested = os.environ.get("REQUESTED_BUCKET", "").strip()
          bucket = requested or f"{HfApi().whoami()['name']}/audiobook-merge-artifacts"
          create_bucket(bucket, exist_ok=True)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"bucket={bucket}\n")
          print(f"Using HF Storage Bucket: {bucket}")
          PY
      - name: Discover worker artifacts
        id: workers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          run_id=$(printf '%s' "$SOURCE_RUN_ID" | sed -E 's#^.*/actions/runs/([0-9]+)/?.*$#\1#')
          [[ "$run_id" =~ ^[0-9]+$ ]] || { echo "Invalid source run: $SOURCE_RUN_ID" >&2; exit 1; }
          names=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100" --jq '.artifacts[] | select(.expired == false) | .name' | grep -E '^mp4-worker-[0-9]+$' | sort -t- -k3,3n)
          [[ -n "$names" ]] || { echo "No live mp4-worker artifacts" >&2; exit 1; }
          echo "count=$(printf '%s\n' "$names" | grep -c .)" >> "$GITHUB_OUTPUT"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

  finalize_and_upload:
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies and HF Bucket mount
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg nfs-common
          pip install -r requirements.txt
          curl --fail --location --retry 5 \
            https://github.com/huggingface/hf-mount/releases/download/v0.9.2/hf-mount-x86_64-linux \
            --output "$RUNNER_TEMP/hf-mount"
          curl --fail --location --retry 5 \
            https://github.com/huggingface/hf-mount/releases/download/v0.9.2/hf-mount-nfs-x86_64-linux \
            --output "$RUNNER_TEMP/hf-mount-nfs"
          chmod +x "$RUNNER_TEMP/hf-mount" "$RUNNER_TEMP/hf-mount-nfs"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Mount HF Bucket without local file cache
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/hf-bucket"
          "$RUNNER_TEMP/hf-mount" start \
            --hf-token "$HF_TOKEN" \
            --no-disk-cache \
            bucket "${{ needs.discover.outputs.bucket }}" \
            "$RUNNER_TEMP/hf-bucket"
          ls "$RUNNER_TEMP/hf-bucket" >/dev/null
      - name: Remove legacy HF worker checkpoints
        run: |
          run_root="$RUNNER_TEMP/hf-bucket/runs/${{ needs.discover.outputs.run_id }}"
          rm -rf "$run_root/workers" "$run_root/metadata"
      - name: Merge on GitHub runner and upload to YouTube
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        run: |
          python "合併上傳/bucket_pipeline.py" \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "${{ needs.discover.outputs.run_id }}" \
            --bucket-mount "$RUNNER_TEMP/hf-bucket" \
            --expected-workers "${{ needs.discover.outputs.count }}" \
            --privacy "${{ inputs.privacy }}"
      - name: Stop HF Bucket mount
        if: always()
        run: |
          "$RUNNER_TEMP/hf-mount" stop "$RUNNER_TEMP/hf-bucket" || true
