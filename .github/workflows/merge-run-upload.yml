name: Merge one run into one YouTube video

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Source Actions run URL or numeric ID"
        required: true
        type: string
      privacy:
        description: "Initial YouTube privacy"
        required: true
        default: private
        type: choice
        options: [private, unlisted, public]
      checkpoint_repo:
        description: "HF Storage Bucket (blank = auto-create)"
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: merge-run-upload-${{ inputs.source_run_id }}
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.workers.outputs.matrix }}
      count: ${{ steps.workers.outputs.count }}
      run_id: ${{ steps.workers.outputs.run_id }}
      first_worker: ${{ steps.workers.outputs.first_worker }}
      bucket: ${{ steps.bucket.outputs.bucket }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "huggingface_hub>=1.6.0"
      - name: Create or reuse public HF Storage Bucket
        id: bucket
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          REQUESTED_BUCKET: ${{ inputs.checkpoint_repo }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi, create_bucket
          requested = os.environ.get("REQUESTED_BUCKET", "").strip()
          bucket = requested or f"{HfApi().whoami()['name']}/audiobook-merge-artifacts"
          create_bucket(bucket, exist_ok=True)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"bucket={bucket}\n")
          print(f"Using HF Storage Bucket: {bucket}")
          PY
      - name: Discover worker artifacts
        id: workers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          run_id=$(printf '%s' "$SOURCE_RUN_ID" | sed -E 's#^.*/actions/runs/([0-9]+)/?.*$#\1#')
          [[ "$run_id" =~ ^[0-9]+$ ]] || { echo "Invalid source run: $SOURCE_RUN_ID" >&2; exit 1; }
          names=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100" --jq '.artifacts[] | select(.expired == false) | .name' | grep -E '^mp4-worker-[0-9]+$' | sort -t- -k3,3n)
          [[ -n "$names" ]] || { echo "No live mp4-worker artifacts" >&2; exit 1; }
          echo "matrix=$(printf '%s\n' "$names" | jq -Rsc 'split("\n") | map(select(length > 0) | {worker_name: .}) | {include: .}')" >> "$GITHUB_OUTPUT"
          echo "count=$(printf '%s\n' "$names" | grep -c .)" >> "$GITHUB_OUTPUT"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "first_worker=$(printf '%s\n' "$names" | head -n 1)" >> "$GITHUB_OUTPUT"

  stage_workers:
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 15
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          pip install -r requirements.txt
      - name: Download artifact and upload HF Bucket objects
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_XET_HIGH_PERFORMANCE: "1"
        run: |
          python "合併上傳/bucket_pipeline.py" \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "${{ needs.discover.outputs.run_id }}" \
            --bucket "${{ needs.discover.outputs.bucket }}" \
            --worker-name "${{ matrix.worker_name }}" \
            ${{ matrix.worker_name == needs.discover.outputs.first_worker && '--stage-metadata' || '' }}

  launch_hf_job:
    needs: [discover, stage_workers]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "huggingface_hub>=1.6.0"
      - name: Launch final merge and YouTube upload on HF Jobs
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        run: |
          secrets_file="$RUNNER_TEMP/hf-job-secrets.env"
          {
            printf 'HF_TOKEN=%s\n' "$HF_TOKEN"
            printf 'YOUTUBE_REFRESH_TOKEN=%s\n' "$YOUTUBE_REFRESH_TOKEN"
            printf 'YOUTUBE_CLIENT_ID=%s\n' "$YOUTUBE_CLIENT_ID"
            printf 'YOUTUBE_CLIENT_SECRET=%s\n' "$YOUTUBE_CLIENT_SECRET"
          } > "$secrets_file"
          hf jobs run \
            --name "audiobook-${{ needs.discover.outputs.run_id }}" \
            --secrets-file "$secrets_file" \
            -e HF_XET_HIGH_PERFORMANCE=1 \
            -v "hf://buckets/${{ needs.discover.outputs.bucket }}:/bucket:rw" \
            python:3.11-bookworm \
            bash -lc 'apt-get update -qq && apt-get install -y --no-install-recommends ffmpeg git fonts-noto-cjk && git clone --depth 1 https://github.com/${{ github.repository }}.git /app && cd /app && git fetch --depth 1 origin ${{ github.sha }} && git checkout ${{ github.sha }} && pip install -r requirements.txt && python "合併上傳/bucket_pipeline.py" --repository "${{ github.repository }}" --run-id "${{ needs.discover.outputs.run_id }}" --bucket-mount /bucket --expected-workers "${{ needs.discover.outputs.count }}" --privacy "${{ inputs.privacy }}"'
