name: Legacy YouTube Retry Redirect

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  redirect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Run task-aware retry dispatcher once
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python src/queue_dispatcher.py
