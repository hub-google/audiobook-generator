name: "網站部署｜有聲小說管理平台"
run-name: "【網站部署】有聲小說管理平台｜第 ${{ github.run_number }} 次"
on:
  push:
    branches: [main]
    paths:
      - 'docs/site/**'
      - '.github/workflows/audio-web-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: audio-web-pages
  cancel-in-progress: true
jobs:
  deploy:
    name: "部署網站至 GitHub Pages"
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: "檢查網站檔案"
        run: |
          node --check docs/site/app.js
          node --check docs/site/novel-search.js
          test -s docs/site/index.html
          test -s docs/site/style.css
      - name: Prepare Python crawler for 69shuba public ranking
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Generate 69shuba finished-novel ranking
        continue-on-error: true
        run: |
          python -m pip install -q requests beautifulsoup4 curl_cffi pyyaml
          python -m tools.export_69shuba_ranking
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/site
      - name: "等待網站部署檔案可用"
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..18}; do
            count="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length')"
            if [ "$count" = "1" ]; then
              sleep 5
              exit 0
            fi
            echo "Artifact visibility: $count (attempt $attempt)"
            sleep 5
          done
          echo "Pages artifact is not uniquely available" >&2
          exit 1
      - id: deployment
        uses: actions/deploy-pages@v5
      - name: "正式網站免登入與新增清單驗收（實際 GitHub Pages）"
        run: |
          python - <<'PY'
          import requests, time, hashlib
          from pathlib import Path
          url="https://hub-google.github.io/audiobook-generator/"
          error=""
          for i in range(18):
              try:
                  resp=requests.get(url+"?deploy_verify="+str(time.time_ns()),timeout=20,headers={"Cache-Control":"no-cache"})
                  assert resp.status_code==200, f"site HTTP {resp.status_code}"
                  local_index=Path("docs/site/index.html").read_bytes()
                  assert hashlib.sha256(resp.content).digest() == hashlib.sha256(local_index).digest(), "published index.html differs from this exact commit"
                  html=resp.text
                  assert 'id="audio-submitted-books"' in html, "deployed index is not the latest GUI"
                  assert 'id="novel-search-keyword"' in html, "missing novel search"
                  assert 'id="audio-submitted-list"' in html, "missing pending books list"
                  assert 'type="password"' not in html and 'github-token' not in html, "login UI returned"
                  js=requests.get(url+"bridge.js?verify="+str(time.time_ns()),timeout=20)
                  assert js.status_code==200 and "trackSubmitted" in js.text, "site bridge is stale"
                  # Formal-site proof for H21/H23 (not just local mocked Chromium).
                  assert 'id="review-manage-patterns"' in html, "deployed H21 keyword manager missing"
                  review_js=requests.get(url+"review-inspector.js?verify="+str(time.time_ns()),timeout=20)
                  assert review_js.status_code==200, "deployed review-inspector.js missing"
                  local_review=Path("docs/site/review-inspector.js").read_bytes()
                  assert hashlib.sha256(review_js.content).digest() == hashlib.sha256(local_review).digest(), "published review JavaScript differs from this exact commit"
                  assert 'review-manage-patterns' in review_js.text, "H21 rule navigation not deployed"
                  assert '疑似殘留：' in review_js.text and 'Array.from(raw.trim())' in review_js.text, "H23 GUI parity not deployed"
                  api=requests.get(
                      "https://unapiwajmgqqtdkixaab.supabase.co/functions/v1/audio-web-commands/status",
                      timeout=20,headers={"Origin":"https://hub-google.github.io"})
                  assert api.status_code==200 and isinstance(api.json().get("requests"),list), f"API HTTP {api.status_code}"
                  print("LIVE AUDIO PAGES: PASS; no login, submitted queue and command API online")
                  break
              except Exception as exc:
                  error=str(exc)
                  if i==17:raise SystemExit("LIVE AUDIO PAGES FAILED: "+error)
                  time.sleep(5)
          PY
