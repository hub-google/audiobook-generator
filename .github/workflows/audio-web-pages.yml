name: "網站部署｜有聲小說管理平台"
run-name: "【網站部署】有聲小說管理平台｜第 ${{ github.run_number }} 次"
on:
  push:
    branches: [main]
    paths:
      - 'docs/site/**'
      - '.github/workflows/audio-web-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: audio-web-pages
  cancel-in-progress: true
jobs:
  deploy:
    name: "部署網站至 GitHub Pages"
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "檢查網站檔案"
        run: |
          node --check docs/site/app.js
          test -s docs/site/index.html
          test -s docs/site/style.css
      - name: Prepare Python crawler for 69shuba public ranking
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate 69shuba finished-novel ranking
        continue-on-error: true
        run: |
          python -m pip install -q requests beautifulsoup4 curl_cffi pyyaml
          python -m tools.export_69shuba_ranking
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site
      - name: "等待網站部署檔案可用"
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..18}; do
            count="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length')"
            if [ "$count" = "1" ]; then
              sleep 5
              exit 0
            fi
            echo "Artifact visibility: $count (attempt $attempt)"
            sleep 5
          done
          echo "Pages artifact is not uniquely available" >&2
          exit 1
      - id: deployment
        uses: actions/deploy-pages@v4
