name: Deploy AUDIO Web to GitHub Pages
on:
  push:
    branches: [master]
    paths:
      - 'docs/site/**'
      - '.github/workflows/audio-web-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: audio-web-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate dashboard
        run: |
          node --check docs/site/app.js
          test -s docs/site/index.html
          test -s docs/site/style.css
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site
      - id: deployment
        uses: actions/deploy-pages@v4
