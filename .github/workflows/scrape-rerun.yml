name: Immediate Scraper Native Rerun Controller

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Completed audiobook TXT scrape Run ID"
        required: true
        type: string

permissions:
  actions: write
  contents: read

concurrency:
  group: scrape-rerun-${{ inputs.source_run_id || github.run_id }}
  cancel-in-progress: false

jobs:
  rerun_failed_scrape:
    name: "🔄 Re-run failed scraper jobs"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install controller dependencies
        run: pip install requests

      - name: Re-run failed scraper jobs immediately
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          REPOSITORY: ${{ github.repository }}
        run: python src/scrape_rerun_controller.py
