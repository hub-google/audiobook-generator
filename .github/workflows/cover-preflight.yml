name: "封面製作｜小說介紹、封面及審核"
run-name: "【封面與Gemini】${{ inputs.book_title || '待解析書名' }}｜${{ inputs.queue_task_id }}"

on:
  workflow_dispatch:
    inputs:
      book_title: {required: true, type: string}
      queue_task_id: {required: true, type: string}
      catalog_url: {required: true, type: string}
      start_chap: {required: true, type: string}
      end_chap: {required: true, type: string}
      exclude_chapters: {required: false, type: string}
      renumber_selected: {required: false, default: "false", type: string}
      chapter_title_overrides_b64: {required: false, type: string}
      chapter_order_b64: {required: false, type: string}
      book_profile_snapshot_b64: {required: false, type: string}

permissions:
  actions: write
  contents: read

jobs:
  generate_book_introduction:
    name: "📚 產生小說介紹（Gemini）"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements.txt
      - name: 產生小說介紹
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python src/cover_preflight.py \
            --stage introduction \
            --config config.yaml \
            --task-id "${{ inputs.queue_task_id }}" \
            --book-title "${{ inputs.book_title }}" \
            --catalog-url "${{ inputs.catalog_url }}" \
            --book-profile-snapshot-b64 "${{ inputs.book_profile_snapshot_b64 }}"
      - name: 儲存小說介紹
        uses: actions/upload-artifact@v4
        with:
          name: cover-introduction-${{ inputs.queue_task_id }}
          path: |
            Workspace/*/Cover/
            config.yaml
          if-no-files-found: error
          retention-days: 30

  generate_cover_information:
    name: "🧠 產生封面資料（Gemini）"
    needs: generate_book_introduction
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: cover-introduction-${{ inputs.queue_task_id }}
          path: .
      - name: 產生封面資訊
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python src/cover_preflight.py \
            --stage cover-information \
            --config config.yaml \
            --task-id "${{ inputs.queue_task_id }}"
      - name: 儲存封面資訊
        uses: actions/upload-artifact@v4
        with:
          name: cover-information-${{ inputs.queue_task_id }}
          path: |
            Workspace/*/Cover/
            config.yaml
          if-no-files-found: error
          retention-days: 30

  review_cover_information:
    name: "🔎 檢查封面資訊與提示詞"
    needs: generate_cover_information
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: cover-information-${{ inputs.queue_task_id }}
          path: .
      - name: 檢查封面資訊並準備生圖指令
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python src/cover_preflight.py \
            --stage review \
            --config config.yaml \
            --task-id "${{ inputs.queue_task_id }}"
      - name: 儲存已審核生圖指令
        uses: actions/upload-artifact@v4
        with:
          name: cover-prompt-${{ inputs.queue_task_id }}
          path: |
            Workspace/*/Cover/
            config.yaml
          if-no-files-found: error
          retention-days: 30

  generate_cover:
    name: "🎨 產生小說封面（HF 或 Gemini）"
    needs: review_cover_information
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: cover-prompt-${{ inputs.queue_task_id }}
          path: .
      - name: 產生待審核封面
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_IMAGE_MODEL: gemini-2.5-flash-image
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_WORKERS_FREE_CONFIRMED: ${{ vars.CLOUDFLARE_WORKERS_FREE_CONFIRMED }}
          COVER_IMAGE_PROVIDER: cloudflare
        run: |
          python src/cover_preflight.py \
            --stage cover \
            --config config.yaml \
            --task-id "${{ inputs.queue_task_id }}"
      - name: 儲存封面審核資料
        uses: actions/upload-artifact@v4
        with:
          name: cover-review-${{ inputs.queue_task_id }}
          path: |
            Workspace/*/Cover/
            config.yaml
          if-no-files-found: error
          retention-days: 30

  # A workflow cannot rerun itself while it is still in progress. Dispatch a
  # small controller after every cover stage has settled. The controller waits
  # for this Run to complete, then owns up to 20 native failed-job reruns.
  trigger_cover_rerun:
    name: "🔁 啟動封面失敗重跑"
    needs:
      - generate_book_introduction
      - generate_cover_information
      - review_cover_information
      - generate_cover
    if: failure() && github.run_attempt == 1
    runs-on: ubuntu-latest
    steps:
      - name: 啟動封面失敗重跑檢查
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ID: ${{ github.run_id }}
        run: |
          gh workflow run cover-rerun.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF_NAME" \
            --field source_run_id="$SOURCE_RUN_ID"
