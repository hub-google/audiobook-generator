name: 有聲小說｜重構回歸測試
on:
  workflow_dispatch:
  push:
    branches: ["refactor/reliability-20261125", "refactor/final-acceptance-20261125", master]
permissions:
  contents: read
concurrency:
  group: regression-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk xvfb
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m compileall -q src gui_components tests 合併上傳 tools gui_app.py
      - run: xvfb-run -a python -m pytest -q tests src/image/kaggle_chapter_images/tests

  live-service-check:
    if: github.ref == 'refs/heads/refactor/final-acceptance-20261125' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check production image and external services without publication
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_ARCHIVE_REPO: ${{ vars.HF_ARCHIVE_REPO }}
          YOUTUBE_ACTIVE_SLOTS: ${{ vars.YOUTUBE_ACTIVE_SLOTS || '1' }}
          YOUTUBE_CLIENT_ID_1: ${{ secrets.YOUTUBE_CLIENT_ID_1 }}
          YOUTUBE_CLIENT_SECRET_1: ${{ secrets.YOUTUBE_CLIENT_SECRET_1 }}
          YOUTUBE_REFRESH_TOKEN_1: ${{ secrets.YOUTUBE_REFRESH_TOKEN_1 }}
          YOUTUBE_CLIENT_ID_2: ${{ secrets.YOUTUBE_CLIENT_ID_2 }}
          YOUTUBE_CLIENT_SECRET_2: ${{ secrets.YOUTUBE_CLIENT_SECRET_2 }}
          YOUTUBE_REFRESH_TOKEN_2: ${{ secrets.YOUTUBE_REFRESH_TOKEN_2 }}
          YOUTUBE_CLIENT_ID_3: ${{ secrets.YOUTUBE_CLIENT_ID_3 }}
          YOUTUBE_CLIENT_SECRET_3: ${{ secrets.YOUTUBE_CLIENT_SECRET_3 }}
          YOUTUBE_REFRESH_TOKEN_3: ${{ secrets.YOUTUBE_REFRESH_TOKEN_3 }}
          YOUTUBE_CLIENT_ID_4: ${{ secrets.YOUTUBE_CLIENT_ID_4 }}
          YOUTUBE_CLIENT_SECRET_4: ${{ secrets.YOUTUBE_CLIENT_SECRET_4 }}
          YOUTUBE_REFRESH_TOKEN_4: ${{ secrets.YOUTUBE_REFRESH_TOKEN_4 }}
          YOUTUBE_CLIENT_ID_5: ${{ secrets.YOUTUBE_CLIENT_ID_5 }}
          YOUTUBE_CLIENT_SECRET_5: ${{ secrets.YOUTUBE_CLIENT_SECRET_5 }}
          YOUTUBE_REFRESH_TOKEN_5: ${{ secrets.YOUTUBE_REFRESH_TOKEN_5 }}
          YOUTUBE_CLIENT_ID_6: ${{ secrets.YOUTUBE_CLIENT_ID_6 }}
          YOUTUBE_CLIENT_SECRET_6: ${{ secrets.YOUTUBE_CLIENT_SECRET_6 }}
          YOUTUBE_REFRESH_TOKEN_6: ${{ secrets.YOUTUBE_REFRESH_TOKEN_6 }}
          YOUTUBE_CLIENT_ID_7: ${{ secrets.YOUTUBE_CLIENT_ID_7 }}
          YOUTUBE_CLIENT_SECRET_7: ${{ secrets.YOUTUBE_CLIENT_SECRET_7 }}
          YOUTUBE_REFRESH_TOKEN_7: ${{ secrets.YOUTUBE_REFRESH_TOKEN_7 }}
          YOUTUBE_CLIENT_ID_8: ${{ secrets.YOUTUBE_CLIENT_ID_8 }}
          YOUTUBE_CLIENT_SECRET_8: ${{ secrets.YOUTUBE_CLIENT_SECRET_8 }}
          YOUTUBE_REFRESH_TOKEN_8: ${{ secrets.YOUTUBE_REFRESH_TOKEN_8 }}
          YOUTUBE_CLIENT_ID_9: ${{ secrets.YOUTUBE_CLIENT_ID_9 }}
          YOUTUBE_CLIENT_SECRET_9: ${{ secrets.YOUTUBE_CLIENT_SECRET_9 }}
          YOUTUBE_REFRESH_TOKEN_9: ${{ secrets.YOUTUBE_REFRESH_TOKEN_9 }}
          YOUTUBE_CLIENT_ID_10: ${{ secrets.YOUTUBE_CLIENT_ID_10 }}
          YOUTUBE_CLIENT_SECRET_10: ${{ secrets.YOUTUBE_CLIENT_SECRET_10 }}
          YOUTUBE_REFRESH_TOKEN_10: ${{ secrets.YOUTUBE_REFRESH_TOKEN_10 }}
        run: |
          args=()
          while IFS= read -r name; do
            case "$name" in HF_TOKEN|HF_ARCHIVE_REPO|YOUTUBE_ACTIVE_SLOTS|YOUTUBE_CLIENT_ID_*|YOUTUBE_CLIENT_SECRET_*|YOUTUBE_REFRESH_TOKEN_*) args+=(-e "$name");; esac
          done < <(compgen -e)
          docker run --rm -v "$GITHUB_WORKSPACE:/work:ro" -w /work "${args[@]}" -e PYTHONPATH=/work ghcr.io/hub-google/audiobook-worker@sha256:4979e4cda14569f3d0b941341dd2ae819db5b2f8863c6738acf138f951feb9b1 python tools/live_service_check.py
  schedule-health:
    if: github.ref == 'refs/heads/master'
    needs: regression
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Restore schedules disabled by repository inactivity only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for workflow in queue-dispatcher.yml hf-upload-resume-scheduler.yml; do
            state=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow" --jq .state)
            echo "$workflow: $state"
            if [ "$state" = disabled_inactivity ]; then
              gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/enable"
              echo "$workflow: re-enabled after inactivity"
            fi
          done
