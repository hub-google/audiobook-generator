name: Validate YouTube credential pool

on:
  workflow_dispatch:
    inputs:
      video_id:
        description: Existing uploaded video that every credential must manage
        required: true
        default: FW7JdlfF5iI

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/hub-google/audiobook-worker@sha256:74856ba2efca08fd57c0d384f5b7477c0e74e4b6f2082894a5ac22f6f6bc7fe1
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify all ten credentials can continue the same upload
        env:
          TARGET_VIDEO_ID: ${{ inputs.video_id }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CLIENT_ID_2: ${{ secrets.YOUTUBE_CLIENT_ID_2 }}
          YOUTUBE_CLIENT_SECRET_2: ${{ secrets.YOUTUBE_CLIENT_SECRET_2 }}
          YOUTUBE_REFRESH_TOKEN_2: ${{ secrets.YOUTUBE_REFRESH_TOKEN_2 }}
          YOUTUBE_CLIENT_ID_3: ${{ secrets.YOUTUBE_CLIENT_ID_3 }}
          YOUTUBE_CLIENT_SECRET_3: ${{ secrets.YOUTUBE_CLIENT_SECRET_3 }}
          YOUTUBE_REFRESH_TOKEN_3: ${{ secrets.YOUTUBE_REFRESH_TOKEN_3 }}
          YOUTUBE_CLIENT_ID_4: ${{ secrets.YOUTUBE_CLIENT_ID_4 }}
          YOUTUBE_CLIENT_SECRET_4: ${{ secrets.YOUTUBE_CLIENT_SECRET_4 }}
          YOUTUBE_REFRESH_TOKEN_4: ${{ secrets.YOUTUBE_REFRESH_TOKEN_4 }}
          YOUTUBE_CLIENT_ID_5: ${{ secrets.YOUTUBE_CLIENT_ID_5 }}
          YOUTUBE_CLIENT_SECRET_5: ${{ secrets.YOUTUBE_CLIENT_SECRET_5 }}
          YOUTUBE_REFRESH_TOKEN_5: ${{ secrets.YOUTUBE_REFRESH_TOKEN_5 }}
          YOUTUBE_CLIENT_ID_6: ${{ secrets.YOUTUBE_CLIENT_ID_6 }}
          YOUTUBE_CLIENT_SECRET_6: ${{ secrets.YOUTUBE_CLIENT_SECRET_6 }}
          YOUTUBE_REFRESH_TOKEN_6: ${{ secrets.YOUTUBE_REFRESH_TOKEN_6 }}
          YOUTUBE_CLIENT_ID_7: ${{ secrets.YOUTUBE_CLIENT_ID_7 }}
          YOUTUBE_CLIENT_SECRET_7: ${{ secrets.YOUTUBE_CLIENT_SECRET_7 }}
          YOUTUBE_REFRESH_TOKEN_7: ${{ secrets.YOUTUBE_REFRESH_TOKEN_7 }}
          YOUTUBE_CLIENT_ID_8: ${{ secrets.YOUTUBE_CLIENT_ID_8 }}
          YOUTUBE_CLIENT_SECRET_8: ${{ secrets.YOUTUBE_CLIENT_SECRET_8 }}
          YOUTUBE_REFRESH_TOKEN_8: ${{ secrets.YOUTUBE_REFRESH_TOKEN_8 }}
          YOUTUBE_CLIENT_ID_9: ${{ secrets.YOUTUBE_CLIENT_ID_9 }}
          YOUTUBE_CLIENT_SECRET_9: ${{ secrets.YOUTUBE_CLIENT_SECRET_9 }}
          YOUTUBE_REFRESH_TOKEN_9: ${{ secrets.YOUTUBE_REFRESH_TOKEN_9 }}
          YOUTUBE_CLIENT_ID_10: ${{ secrets.YOUTUBE_CLIENT_ID_10 }}
          YOUTUBE_CLIENT_SECRET_10: ${{ secrets.YOUTUBE_CLIENT_SECRET_10 }}
          YOUTUBE_REFRESH_TOKEN_10: ${{ secrets.YOUTUBE_REFRESH_TOKEN_10 }}
          YOUTUBE_EXPECTED_ACCOUNT_COUNT: "10"
        run: |
          python - <<'PY'
          import os
          from src.youtube_api_uploader import YouTubeServicePool

          video_id = os.environ["TARGET_VIDEO_ID"]
          pool = YouTubeServicePool()
          pool.require_expected_accounts()

          failures = []
          channels = {}
          for index, account in enumerate(pool.accounts):
              slot = account["slot"]
              service = pool.get_service(index)
              try:
                  channel_items = service.channels().list(
                      part="id", mine=True
                  ).execute().get("items") or []
                  if len(channel_items) != 1 or not channel_items[0].get("id"):
                      raise RuntimeError("credential does not resolve to exactly one channel")
                  channel_id = channel_items[0]["id"]
                  channels[slot] = channel_id
                  videos = service.videos().list(
                      part="id,status", id=video_id
                  ).execute().get("items") or []
                  if len(videos) != 1:
                      raise RuntimeError("video is not visible/manageable")
                  service.captions().list(
                      part="id,snippet", videoId=video_id
                  ).execute()
                  playlists = service.playlists().list(
                      part="id", mine=True, maxResults=1
                  ).execute().get("items") or []
                  if not playlists:
                      raise RuntimeError("channel playlists are not accessible")
                  print(f"PASS slot {slot}: channel, video, captions, and playlists are accessible")
              except Exception as error:
                  if "quotaExceeded" in str(error):
                      print(f"EXPECTED slot {slot}: quota exhausted; rotation required")
                  else:
                      failures.append(f"slot {slot}: {error}")

          if len(set(channels.values())) > 1:
              failures.append(
                  "channel mismatch: "
                  + ", ".join(f"slot {slot}={channel}" for slot, channel in sorted(channels.items()))
              )
          if failures:
              raise RuntimeError("Credential continuation check failed: " + " | ".join(failures))

          for index, account in enumerate(pool.accounts):
              pool.active_index = index
              try:
                  response = pool.videos().list(part="id", id=video_id).execute()
                  if len(response.get("items") or []) != 1:
                      raise RuntimeError(f"pool delegation failed at slot {account['slot']}")
              except Exception as error:
                  if "quotaExceeded" not in str(error):
                      raise
                  print(f"EXPECTED slot {account['slot']}: delegation reached exhausted quota")

          pool.active_index = 0
          if not pool.rotate_on_quota(Exception("quotaExceeded")):
              raise RuntimeError("live rotation could not leave exhausted slot 1")
          while True:
              try:
                  pool.captions().list(part="id,snippet", videoId=video_id).execute()
                  break
              except Exception as error:
                  if "quotaExceeded" not in str(error) or not pool.rotate_on_quota(error):
                      raise
          print(
              "PASS: quota rotation left exhausted slot 1 -> "
              f"slot {pool.active_account['slot']} and retained caption access"
          )

          print(f"PASS: all {len(pool.accounts)} credential slots manage channel {next(iter(channels.values()))}")
          print("PASS: pool delegation can continue the same uploaded video through every slot")
          PY
