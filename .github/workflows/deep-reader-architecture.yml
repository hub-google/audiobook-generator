name: 有聲小說｜閱讀器深度診斷
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'tools/deep_reader_architecture.py'
      - '.github/workflows/deep-reader-architecture.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        source: [moon17, book8]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests beautifulsoup4
      - run: python -m tools.deep_reader_architecture ${{ matrix.source }}
