name: Publish Kaggle chapter images to HF

on:
  workflow_dispatch:
    inputs:
      kaggle_kernel:
        description: Completed private Kaggle kernel slug
        required: true
        default: cit5055/quanzhigaoshou-chapter-images
      hf_repo_id:
        description: Existing HF dataset repository
        required: true
        default: hub-google/audiobook-archive

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      INPUT_KAGGLE_KERNEL: ${{ inputs.kaggle_kernel }}
      INPUT_HF_REPO_ID: ${{ inputs.hf_repo_id }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download the completed Kaggle output
        run: |
          pip install "kaggle>=1.7,<2" "huggingface-hub>=1.0,<2" pillow
          kaggle kernels output "$INPUT_KAGGLE_KERNEL" -p "$RUNNER_TEMP/kaggle-output"

      - name: Validate all generated chapters and image manifests
        run: |
          PYTHONPATH=src/image/kaggle_chapter_images python -c 'import os; from validate_outputs import validate_output; print(validate_output(os.path.join(os.environ["RUNNER_TEMP"], "kaggle-output/chapter_images")))'

      - name: Publish content then manifests then latest pointer
        run: |
          python src/image/kaggle_chapter_images/publish_outputs.py \
            --output "$RUNNER_TEMP/kaggle-output/chapter_images" \
            --assets src/image/kaggle_chapter_images \
            --repo-id "$INPUT_HF_REPO_ID" \
            --env-file /dev/null
