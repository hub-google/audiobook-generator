name: 有聲小說｜台灣小說網獨立驗證
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'src/sources/twkan.py'
      - 'tools/validate_twkan.py'
      - '.github/workflows/twkan-validation.yml'
permissions:
  contents: read
jobs:
  twkan:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests beautifulsoup4
      - run: python -m tools.validate_twkan
