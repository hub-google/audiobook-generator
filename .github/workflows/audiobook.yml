name: Audiobook Automation Pipeline (Parallel)

on:
  workflow_dispatch:
    inputs:
      catalog_url:
        description: '小說目錄網址 (e.g. https://tw.hjwzw.com/Book/Chapter/1644)'
        required: true
        default: 'https://tw.hjwzw.com/Book/Chapter/1644'
      start_chap:
        description: '開始章節 (Start Chapter, 1-based)'
        required: true
        default: '1'
      end_chap:
        description: '結束章節 (End Chapter, 1-based)'
        required: true
        default: '10'
      exclude_chapters:
        description: '排除章節的編號 (逗號分隔，如 12,105,106)'
        required: false
        default: ''
      chapters_per_worker:
        description: '每台工作機負責的章節數 (預設 10，最多 20 台並行)'
        required: true
        default: '10'
      zip_password:
        description: 'ZIP 解密密碼 (可選，從 GUI 或 Secrets 傳入)'
        required: false
        default: ''
  schedule:
    # GitHub cron uses UTC. This checks every 30 minutes and re-runs only the
    # failed jobs from the latest manually-started audiobook run.
    - cron: '*/30 * * * *'

permissions:
  contents: write
  actions: write

# Prevent a scheduled retry from overlapping the active audiobook run.
concurrency:
  group: youtube-resumable-upload
  cancel-in-progress: false

jobs:
  retry_failed_run:
    name: "Retry latest failed audiobook run"
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest

    steps:
      - name: Re-run failed jobs after the 30-minute check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_FILE: audiobook.yml
        run: |
          latest_run=$(gh run list \
            --repo "$REPOSITORY" \
            --workflow "$WORKFLOW_FILE" \
            --event workflow_dispatch \
            --limit 1 \
            --json databaseId,status,conclusion,updatedAt \
            --jq '.[0] // {}')

          run_id=$(jq -r '.databaseId // empty' <<< "$latest_run")
          status=$(jq -r '.status // empty' <<< "$latest_run")
          conclusion=$(jq -r '.conclusion // empty' <<< "$latest_run")
          updated_at=$(jq -r '.updatedAt // empty' <<< "$latest_run")

          echo "## Automatic retry check" >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$run_id" ]; then
            echo "No manually-started audiobook run was found." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$status" != "completed" ]; then
            echo "Run [$run_id](https://github.com/$REPOSITORY/actions/runs/$run_id) is still $status; no duplicate run was started." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$conclusion" = "failure" ]; then
            updated_epoch=$(date -d "$updated_at" +%s)
            now_epoch=$(date -u +%s)
            age_seconds=$((now_epoch - updated_epoch))
            if [ "$age_seconds" -lt 1800 ]; then
              remaining_minutes=$(((1800 - age_seconds + 59) / 60))
              echo "Run [$run_id](https://github.com/$REPOSITORY/actions/runs/$run_id) failed less than 30 minutes ago. It will be eligible in about $remaining_minutes minute(s)." >> "$GITHUB_STEP_SUMMARY"
            else
              gh run rerun "$run_id" --failed --repo "$REPOSITORY"
              echo "Re-running failed jobs from [$run_id](https://github.com/$REPOSITORY/actions/runs/$run_id). Existing chapter and YouTube checkpoints will be reused." >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "Latest manual run [$run_id](https://github.com/$REPOSITORY/actions/runs/$run_id) concluded with **$conclusion**; no retry is needed." >> "$GITHUB_STEP_SUMMARY"
          fi

  setup:
    name: "🔍 Setup — Parse Catalog & Build Matrix"
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen_matrix.outputs.matrix }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Parse Catalog & Generate config.yaml + matrix.json
        run: |
          python src/catalog_parser.py \
            --url "${{ github.event.inputs.catalog_url }}" \
            --start ${{ github.event.inputs.start_chap }} \
            --end   ${{ github.event.inputs.end_chap }} \
            --output config.yaml \
            --workers ${{ github.event.inputs.chapters_per_worker }} \
            --matrix-output matrix.json \
            --exclude-chapters "${{ github.event.inputs.exclude_chapters }}"

      - name: Export matrix to GitHub Actions output
        id: gen_matrix
        run: |
          echo 'matrix<<EOF' >> $GITHUB_OUTPUT
          cat matrix.json >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo 'EOF' >> $GITHUB_OUTPUT

      - name: Generate Setup Summary
        run: |
          echo "## 📚 Audiobook Pipeline Started" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ **Target URL:** ${{ github.event.inputs.catalog_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ **Chapter Range:** ${START} ~ ${END}" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ **Workers Created:** $(jq '. | length' matrix.json)" >> "$GITHUB_STEP_SUMMARY"
        env:
          START: ${{ github.event.inputs.start_chap }}
          END: ${{ github.event.inputs.end_chap }}

      - name: Upload config.yaml as shared artifact
        uses: actions/upload-artifact@v4
        with:
          name: shared-config
          path: config.yaml

# ─────────────────────────────────────────────────────────────
# Worker Pipeline: 並行獨立處理各 Worker 的章節 (一條龍 End-to-End)
# ─────────────────────────────────────────────────────────────
  process_chapters:
    name: "⚡ Worker ${{ matrix.worker_id }} (Ch ${{ matrix.start_chap }}~${{ matrix.end_chap }})"
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Deps (FFmpeg + CJK Fonts)
        run: |
          sudo env DEBIAN_FRONTEND=noninteractive timeout 10m apt-get update -qq -o Acquire::Retries=3
          sudo env DEBIAN_FRONTEND=noninteractive timeout 15m apt-get install -y --no-install-recommends -o Acquire::Retries=3 -o DPkg::Lock::Timeout=60 ffmpeg fonts-noto-cjk fonts-wqy-zenhei

      - name: Install Python Dependencies
        run: pip install -r requirements.txt

      - name: Download shared config
        uses: actions/download-artifact@v4
        with:
          name: shared-config

      - name: Restore Worker Workspace Checkpoint
        uses: actions/cache/restore@v4
        with:
          path: Workspace/
          key: ${{ matrix.book_title }}-chap${{ matrix.start_chap }}-${{ matrix.end_chap }}-worker${{ matrix.worker_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ matrix.book_title }}-chap${{ matrix.start_chap }}-${{ matrix.end_chap }}-worker${{ matrix.worker_id }}-

      - name: Log Cache Location
        run: |
          echo "=================================================="
          echo "📂 斷點續傳快取路徑 (Cache Location):"
          echo "   • 虛擬機工作目錄: Workspace/"
          echo "   • 雲端快取管理頁: https://github.com/${{ github.repository }}/actions/caches"
          echo "=================================================="

      - name: Run Per-Chapter End-to-End Pipeline (Real-Time Saving)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python src/worker_pipeline.py --stage pipeline --worker-id ${{ matrix.worker_id }} --batch-size 1

      - name: Save Worker Workspace Checkpoint
        if: always()
        uses: actions/cache/save@v4
        with:
          path: Workspace/
          key: ${{ matrix.book_title }}-chap${{ matrix.start_chap }}-${{ matrix.end_chap }}-worker${{ matrix.worker_id }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload MP4 Videos & Subtitles Only (Lightweight Artifact for YouTube Upload)
        uses: actions/upload-artifact@v4
        with:
          name: mp4-worker-${{ matrix.worker_id }}
          path: |
            Workspace/*/Video/
            Workspace/*/Subtitles/
            Upload_Subtitles/
          if-no-files-found: warn

      - name: Upload full worker workspace artifact (Heavyweight for Inspection)
        uses: actions/upload-artifact@v4
        with:
          name: video-worker-${{ matrix.worker_id }}
          path: Workspace/
          if-no-files-found: warn

      - name: Worker Job Summary
        if: always()
        run: |
          echo "## ⚡ Worker ${{ matrix.worker_id }} Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "📦 **Chapters:** ${{ matrix.start_chap }} ~ ${{ matrix.end_chap }}" >> "$GITHUB_STEP_SUMMARY"
          
          if [ -d "Workspace" ]; then
            audio_count=$(find Workspace/*/Audio/ -name "*.wav" 2>/dev/null | wc -l || echo 0)
            video_count=$(find Workspace/*/Video/ -name "*.mp4" 2>/dev/null | wc -l || echo 0)
            echo "📊 **Audio Generated:** $audio_count" >> "$GITHUB_STEP_SUMMARY"
            echo "🎥 **Video Generated:** $video_count" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⚠️ Workspace directory not found. Worker might have failed early." >> "$GITHUB_STEP_SUMMARY"
          fi

# ─────────────────────────────────────────────────────────────
# Automatic YouTube API Upload & Playlist Builder (無直播，純 API 暴速上傳)
# ─────────────────────────────────────────────────────────────
  upload_to_youtube:
    name: "📤 Automatic YouTube API Upload (Video + Subtitles + Playlist)"
    needs: process_chapters
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: pip install -r requirements.txt

      - name: Install FFmpeg
        run: |
          sudo env DEBIAN_FRONTEND=noninteractive timeout 10m apt-get update -qq -o Acquire::Retries=3
          sudo env DEBIAN_FRONTEND=noninteractive timeout 10m apt-get install -y --no-install-recommends -o Acquire::Retries=3 -o DPkg::Lock::Timeout=60 ffmpeg

      - name: Restore latest YouTube upload checkpoint
        uses: actions/cache/restore@v4
        with:
          path: |
            upload_resume_state/
            Workspace/*/Cover/
            Upload_Subtitles/
          key: youtube-upload-state-source-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            youtube-upload-state-source-${{ github.run_id }}-

      - name: Run YouTube API Uploader
        env:
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set +e
          python src/youtube_api_uploader.py --run-id "${{ github.run_id }}" --repo "${{ github.repository }}" --privacy "public" --state-file upload_resume_state/state.json
          code=$?
          if [ "$code" -ne 0 ] && [ "$code" -ne 75 ]; then exit "$code"; fi
          exit "$code"

      - name: Generate Job Summary
        if: always()
        run: |
          python - <<'PY'
          import json, os
          
          state_file = "upload_resume_state/state.json"
          if not os.path.exists(state_file):
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
                  f.write("## YouTube Upload Status\nNo state file found.\n")
              exit(0)
              
          with open(state_file, encoding="utf-8") as f:
              state = json.load(f)
              
          done = len(state.get("completed_titles", []))
          total = len(state.get("part_plan", [])) or max(done, 1)
          pending = len(state.get("pending_thumbnails", {}))
          pending_playlist = len(state.get("pending_playlist", {}))
          pending_captions = len(state.get("pending_captions", {}))
          pending_publish = len(state.get("pending_publish", {}))
          status = state.get("status", "unknown")
          
          status_icon = "⏸️"
          if status == "complete": status_icon = "🎉"
          elif status == "failed": status_icon = "❌"
          elif status == "unknown": status_icon = "⚠️"
          
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write(f"## {status_icon} YouTube Upload Status: {status.upper()}\n\n")
              f.write(f"| 項目 | 狀態資訊 |\n|---|---|\n")
              f.write(f"| **任務進度** | **{done} / {total} Parts** ({done/total*100:.1f}%) |\n")
              f.write(f"| **Pending Thumbnails** | **{pending}** |\n")
              f.write(f"| **Pending Playlist Inserts** | **{pending_playlist}** |\n")
              f.write(f"| **Pending CC Captions** | **{pending_captions}** |\n")
              f.write(f"| **Pending Final Publish** | **{pending_publish}** |\n")
              if "reason" in state and state["reason"]:
                  f.write(f"| **Reason** | `{state['reason']}` |\n")
              if "retry_at" in state and state["retry_at"]:
                  f.write(f"| **Retry After** | `{state['retry_at']}` |\n")
                  
              playlist_url = state.get("playlist_url")
              if playlist_url and playlist_url.startswith("http"):
                  f.write(f"| **播放清單** | [點此開啟 YouTube 播放清單]({playlist_url}) |\n")
          PY

      - name: Save YouTube upload checkpoint
        if: always() && hashFiles('upload_resume_state/state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: |
            upload_resume_state/
            Workspace/*/Cover/
            Upload_Subtitles/
          key: youtube-upload-state-source-${{ github.run_id }}-${{ github.run_attempt }}
