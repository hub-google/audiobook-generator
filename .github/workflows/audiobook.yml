name: Audiobook Automation Pipeline (Parallel)

run-name: "有聲小說製作｜${{ inputs.book_title || '待解析書名' }}｜${{ inputs.chapter_label != '' && inputs.chapter_label || format('Ch{0}-{1}', inputs.start_chap, inputs.end_chap) }}｜${{ inputs.queue_task_id || 'GUI直接執行' }}"

on:
  workflow_dispatch:
    inputs:
      book_title:
        description: '小說書名（只用於可讀的 Run 名稱）'
        required: false
        default: ''
      chapter_label:
        description: '顯示用的實際章節標籤（例如：Ch1-3156 或 Ch1-3300(實做3156章)；留空時自動用 Ch{start}-{end}）'
        required: false
        default: ''
      queue_task_id:
        description: '雲端佇列任務 ID；手動執行可留空'
        required: false
        default: ''
      resume_source_run_id:
        description: '接續既有失敗 Run 的數字 ID；一般新任務留空'
        required: false
        default: ''
      catalog_url:
        description: '小說目錄網址 (e.g. https://tw.hjwzw.com/Book/Chapter/1644)'
        required: true
        default: 'https://tw.hjwzw.com/Book/Chapter/1644'
      start_chap:
        description: '開始章節 (Start Chapter, 1-based)'
        required: true
        default: '1'
      end_chap:
        description: '結束章節 (End Chapter, 1-based)'
        required: true
        default: '10'
      exclude_chapters:
        description: '排除章節的編號 (逗號分隔，如 12,105,106)'
        required: false
        default: ''
      renumber_selected:
        description: '將已選章節重新編為連續章號'
        required: false
        default: 'false'
      chapter_title_overrides_b64:
        description: 'GUI 編輯後的章節名稱（Base64 JSON；固定目錄 UUID 對應完整標題）'
        required: false
        default: ''
      chapter_order_b64:
        description: 'GUI 排定的實際製作順序（Base64 JSON UUID 陣列）'
        required: false
        default: ''
      book_profile_snapshot_b64:
        description: '書籍長期設定快照（Base64 JSON；由 GUI／調度器產生）'
        required: false
        default: ''
      chapters_per_worker:
        description: '每台工作機負責的章節數 (預設 10，總共最多建立 17 台)'
        required: true
        default: '10'
      zip_password:
        description: 'ZIP 解密密碼 (可選，從 GUI 或 Secrets 傳入)'
        required: false
        default: ''

permissions:
  contents: write
  actions: write
  packages: read

concurrency:
  group: youtube-resumable-upload
  cancel-in-progress: false

jobs:
  retry_failed_run:
    name: "Retry latest failed audiobook run"
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest

    steps:
      - name: Re-run failed jobs after the 30-minute check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_FILE: audiobook.yml
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          # Keep only this scheduled check. Completed checks are disposable;
          # production workflow_dispatch runs and their checkpoints are never touched.
          gh run list \
            --repo "$REPOSITORY" \
            --workflow "$WORKFLOW_FILE" \
            --event schedule \
            --limit 100 \
            --json databaseId,status,conclusion \
            --jq ".[] | select(.databaseId != $CURRENT_RUN_ID) | select(.status == \"pending\" or .status == \"queued\" or .status == \"completed\") | .databaseId" |
          while read -r stale_run_id; do
            [ -n "$stale_run_id" ] || continue

            # Re-check immediately before deletion so an already-running check
            # is always preserved.
            stale_status=$(gh run view "$stale_run_id" --repo "$REPOSITORY" --json status --jq '.status')
            if [ "$stale_status" = "in_progress" ]; then
              echo "Keeping scheduled run $stale_run_id because it is already running."
              continue
            fi

            if [ "$stale_status" = "pending" ] || [ "$stale_status" = "queued" ]; then
              gh run cancel "$stale_run_id" --repo "$REPOSITORY" || true
              for attempt in {1..12}; do
                stale_status=$(gh run view "$stale_run_id" --repo "$REPOSITORY" --json status --jq '.status')
                [ "$stale_status" = "completed" ] && break
                [ "$stale_status" = "in_progress" ] && break
                sleep 5
              done
            fi

            if [ "$stale_status" = "completed" ]; then
              gh api --method DELETE "repos/$REPOSITORY/actions/runs/$stale_run_id"
              echo "Deleted stale scheduled run $stale_run_id."
            else
              echo "Keeping scheduled run $stale_run_id because its status is now $stale_status."
            fi
          done

          latest_run=$(gh run list \
            --repo "$REPOSITORY" \
            --workflow "$WORKFLOW_FILE" \
            --event workflow_dispatch \
            --limit 1 \
            --json databaseId,status,conclusion,updatedAt \
            --jq '.[0] // {}')

          run_id=$(jq -r '.databaseId // empty' <<< "$latest_run")
          status=$(jq -r '.status // empty' <<< "$latest_run")
          conclusion=$(jq -r '.conclusion // empty' <<< "$latest_run")
          updated_at=$(jq -r '.updatedAt // empty' <<< "$latest_run")

          # Fetch run_attempt for retry status reporting.
          run_attempt=""
          if [ -n "$run_id" ]; then
            run_attempt=$(gh run view "$run_id" --repo "$REPOSITORY" --json attempt --jq '.attempt // 1' 2>/dev/null || echo "1")
          fi

          echo "## Automatic retry check" >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$run_id" ]; then
            echo "No manually-started audiobook run was found." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$status" != "completed" ]; then
            echo "Run [$run_id](https://github.com/$REPOSITORY/actions/runs/$run_id) is still $status; no duplicate run was started." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$conclusion" = "failure" ]; then
            now_epoch=$(date -u +%s)
            updated_epoch=$(date -d "$updated_at" +%s)
            eligible_epoch=$((updated_epoch + 7200))
            retry_reason="otherError"

            failure_log=$(gh run view "$run_id" --repo "$REPOSITORY" --log-failed 2>/dev/null || true)
            if grep -q 'reason=permanentFailure' <<< "$failure_log"; then
              echo "Run [$run_id](https://github.com/$REPOSITORY/actions/runs/$run_id) has a permanent code/data failure (attempt $run_attempt). Automatic retry is disabled until a corrected commit is dispatched." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            # Daily-limit failures emit a durable retry_at marker. Reading the
            # failed-job log avoids touching YouTube before that exact time.
            retry_line=$(printf '%s\n' "$failure_log" |
              grep -oE 'retry after [0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+[+-][0-9:]+|retry_at=[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+[+-][0-9:]+' |
              tail -n 1 || true)
            retry_at=$(sed -E 's/^retry after |^retry_at=//' <<< "$retry_line")
            if [ -n "$retry_at" ]; then
              parsed_retry_epoch=$(date -d "$retry_at" +%s 2>/dev/null || true)
              if [ -n "$parsed_retry_epoch" ]; then
                eligible_epoch=$parsed_retry_epoch
                retry_reason="YouTubeDailyLimit"
              fi
            fi

            if [ "$now_epoch" -lt "$eligible_epoch" ]; then
              remaining_minutes=$(((eligible_epoch - now_epoch + 59) / 60))
              eligible_at=$(date -u -d "@$eligible_epoch" +'%Y-%m-%dT%H:%M:%SZ')
              echo "Run [$run_id](https://github.com/$REPOSITORY/actions/runs/$run_id) is waiting for **$retry_reason** (attempt $run_attempt). Eligible at **$eligible_at**, in about $remaining_minutes minute(s). No YouTube request was made." >> "$GITHUB_STEP_SUMMARY"
            else
              gh run rerun "$run_id" --failed --repo "$REPOSITORY"
              echo "Re-running failed jobs from [$run_id](https://github.com/$REPOSITORY/actions/runs/$run_id) (attempt $run_attempt → $((run_attempt+1))). Existing chapter and YouTube checkpoints will be reused." >> "$GITHUB_STEP_SUMMARY"
            fi
          elif [ "$conclusion" = "success" ]; then
            echo "### ✅ Upload success confirmed" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The latest manual run [$run_id](https://github.com/$REPOSITORY/actions/runs/$run_id) passed the strict success gate, including all required YouTube video, subtitle, and playlist publication steps." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**Result:** Upload is complete. This scheduled check ended immediately; no retry was started and no YouTube API request was made." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Latest manual run [$run_id](https://github.com/$REPOSITORY/actions/runs/$run_id) concluded with **$conclusion**." >> "$GITHUB_STEP_SUMMARY"
          fi

  setup:
    name: "🔍 Setup — Parse Catalog & Build Matrix"
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen_matrix.outputs.matrix }}
      book_profile_id: ${{ steps.gen_matrix.outputs.book_profile_id }}
      source_max_parallel: ${{ steps.gen_matrix.outputs.source_max_parallel }}
      needs_browser_scrape: ${{ steps.gen_matrix.outputs.needs_browser_scrape }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb jq

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install seleniumbase beautifulsoup4 pyyaml requests curl_cffi

      - name: Restore authoritative shared-config on Resume
        if: github.event.inputs.resume_source_run_id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ID: ${{ github.event.inputs.resume_source_run_id }}
        run: |
          for attempt in 1 2 3; do
            echo "Downloading authoritative shared-config attempt $attempt/3 from Run $SOURCE_RUN_ID"
            rm -rf restored_source
            if gh run download "$SOURCE_RUN_ID" --repo "${{ github.repository }}" --name shared-config --dir restored_source; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error title=Failed to download shared-config::Could not download shared-config from source Run $SOURCE_RUN_ID after 3 attempts"
              exit 1
            fi
            sleep 15
          done
          python src/catalog_parser.py \
            --restore-config restored_source/config.yaml \
            --output config.yaml \
            --matrix-output matrix.json

          DISPATCH_BOOK_TITLE="${{ github.event.inputs.book_title }}" \
          DISPATCH_CHAPTER_LABEL="${{ github.event.inputs.chapter_label }}" \
          DISPATCH_QUEUE_TASK_ID="${{ github.event.inputs.queue_task_id }}" \
          python - <<'PY'
          import os
          import yaml

          with open("config.yaml", encoding="utf-8") as handle:
              config = yaml.safe_load(handle) or {}

          expected_title = str(config.get("book_title") or "").strip()
          supplied_title = os.environ.get("DISPATCH_BOOK_TITLE", "").strip()
          chapter_label = os.environ.get("DISPATCH_CHAPTER_LABEL", "").strip()
          queue_task_id = os.environ.get("DISPATCH_QUEUE_TASK_ID", "").strip()
          missing = [name for name, value in (
              ("book_title", supplied_title),
              ("chapter_label", chapter_label),
              ("queue_task_id", queue_task_id),
          ) if not value]
          if missing:
              raise SystemExit(
                  "Strict resume dispatch validation failed: missing original input(s): "
                  + ", ".join(missing)
              )
          if supplied_title != expected_title:
              raise SystemExit(
                  "Strict resume dispatch validation failed: book_title "
                  f"{supplied_title!r} does not match source config {expected_title!r}"
              )
          PY

      - name: Parse Catalog & Generate config.yaml + matrix.json
        if: github.event.inputs.resume_source_run_id == ''
        run: |
          for attempt in 1 2 3; do
            echo "Catalog parsing attempt $attempt/3"
            if xvfb-run -a python src/catalog_parser.py \
              --url "${{ github.event.inputs.catalog_url }}" \
              --start ${{ github.event.inputs.start_chap }} \
              --end   ${{ github.event.inputs.end_chap }} \
              --output config.yaml \
              --workers ${{ github.event.inputs.chapters_per_worker }} \
              --matrix-output matrix.json \
              --exclude-chapters "${{ github.event.inputs.exclude_chapters }}" \
              --renumber-selected "${{ github.event.inputs.renumber_selected }}" \
              --chapter-title-overrides-b64 "${{ github.event.inputs.chapter_title_overrides_b64 }}" \
              --chapter-order-b64 "${{ github.event.inputs.chapter_order_b64 }}" \
              --book-profile-snapshot-b64 "${{ github.event.inputs.book_profile_snapshot_b64 }}"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 60
          done

      - name: Export matrix to GitHub Actions output
        id: gen_matrix
        run: |
          echo 'matrix<<EOF' >> $GITHUB_OUTPUT
          cat matrix.json >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo 'EOF' >> $GITHUB_OUTPUT
          python -c "import yaml; print('book_profile_id=' + str((yaml.safe_load(open('config.yaml', encoding='utf-8')) or {}).get('book_profile_id') or ''))" >> $GITHUB_OUTPUT
          python -c "import yaml; print('source_max_parallel=' + str((yaml.safe_load(open('config.yaml', encoding='utf-8')) or {}).get('source_max_parallel', 17)))" >> $GITHUB_OUTPUT
          python -c "import yaml; print('needs_browser_scrape=' + str((yaml.safe_load(open('config.yaml', encoding='utf-8')) or {}).get('needs_browser_scrape', False)).lower())" >> $GITHUB_OUTPUT

      - name: Validate non-empty chapter matrix
        run: |
          jq -e 'type == "object" and (.include | type == "array" and length > 0)' matrix.json >/dev/null
          python - <<'PY'
          import json
          import yaml

          with open("config.yaml", encoding="utf-8") as handle:
              config = yaml.safe_load(handle) or {}
          with open("matrix.json", encoding="utf-8") as handle:
              matrix = (json.load(handle) or {}).get("include") or []
          selected = [int(value) for value in config.get("selected_indices") or []]
          patterns = (config.get("cleaner") or {}).get("remove_patterns") or []
          if not isinstance(patterns, list):
              raise SystemExit("Strict success gate: cleaner remove_patterns must be a list")
          if patterns and not (config.get("cleaner") or {}).get("fingerprint"):
              raise SystemExit("Strict success gate: cleaner profile fingerprint is missing")
          if not selected:
              raise SystemExit("Strict success gate: no chapters were selected")
          if not matrix:
              raise SystemExit("Strict success gate: no workers were generated")
          if len(matrix) > 17:
              raise SystemExit(
                  f"Strict success gate: matrix generated {len(matrix)} workers; maximum is 17"
              )
          worker_total = sum(int(item["end_chap"]) - int(item["start_chap"]) + 1 for item in matrix)
          if worker_total < len(selected):
              raise SystemExit(
                  f"Strict success gate: matrix covers {worker_total} slots for {len(selected)} selected chapters"
              )
          PY

      - name: Generate Setup Summary
        run: |
          python - <<'PY'
          import os, yaml, json
          with open("config.yaml", encoding="utf-8") as handle:
              config = yaml.safe_load(handle) or {}
          with open("matrix.json", encoding="utf-8") as handle:
              matrix = (json.load(handle) or {}).get("include") or []
          cleaner = config.get("cleaner") or {}
          selected = [int(value) for value in config.get("selected_indices") or []]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## 📚 Audiobook Pipeline Started\n")
              summary.write(f"✅ **Book:** {config.get('book_title')}\n")
              summary.write(f"✅ **Target URL:** {config.get('catalog_url')}\n")
              summary.write(f"✅ **Chapter Range:** {min(selected)} ~ {max(selected)}\n")
              summary.write(f"✅ **Actual Selected Chapters:** {len(selected)}\n")
              summary.write(f"✅ **Workers Created:** {len(matrix)}\n")
              summary.write(f"✅ **Resume Source Run:** {os.environ.get('SOURCE_RUN_ID') or 'none'}\n")
              summary.write(f"✅ **Book Profile:** `{config.get('book_profile_id') or 'manual/default'}` revision {config.get('profile_revision', 0)}\n")
              summary.write(f"✅ **Cleaner Rules:** {len(cleaner.get('remove_patterns') or [])}\n")
              summary.write(f"✅ **Cleaner Fingerprint:** `{(cleaner.get('fingerprint') or 'none')[:12]}`\n")
          PY
        env:
          SOURCE_RUN_ID: ${{ github.event.inputs.resume_source_run_id }}

      - name: Upload config.yaml as shared artifact
        uses: actions/upload-artifact@v4
        with:
          name: shared-config
          path: |
            config.yaml
            matrix.json

  resume_planner:
    name: "🧭 Global Resume Planner (Publication → Final → Merge → Worker)"
    needs: setup
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/hub-google/audiobook-worker@sha256:8c6b974d2a62daa17234d0d05729db071c9bbb75ca88dbd18964f6f2cf7e7fb0
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      mode: ${{ steps.resume.outputs.mode }}
      source_run_id: ${{ steps.resume.outputs.source_run_id }}
      worker_matrix: ${{ steps.resume.outputs.worker_matrix }}
      merge_matrix: ${{ steps.resume.outputs.merge_matrix }}
      publication_complete: ${{ steps.resume.outputs.publication_complete }}
      has_plan: ${{ steps.resume.outputs.has_plan }}
      final_merge_ready: ${{ steps.resume.outputs.final_merge_ready }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: shared-config
      - name: Plan the deepest valid resume point
        id: resume
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_ARCHIVE_REPO: ${{ vars.HF_ARCHIVE_REPO }}
        run: |
          python src/resume_planner.py \
            --repo "${{ github.repository }}" \
            --run-id "${{ github.run_id }}" \
            --source-run-id "${{ inputs.resume_source_run_id }}" \
            --config config.yaml \
            --matrix matrix.json \
            --output-dir resume_bundle \
            --github-output "$GITHUB_OUTPUT"
      - name: Summarize selected resume work
        run: |
          python - <<'PY'
          import json, os
          plan = json.load(open("resume_bundle/resume-plan.json", encoding="utf-8"))
          lines = ["## Global Resume Planner", "",
                   f"- Selected source Run: {plan.get('source_run_id') or 'none'}",
                   f"- Deepest resume mode: {plan.get('mode')}",
                   f"- Reused worker IDs: {plan.get('reused_worker_ids', [])}",
                   f"- Rerun worker IDs: {plan.get('rerun_worker_ids', [])}",
                   f"- Reused Part numbers: {plan.get('reused_part_numbers', [])}",
                   f"- Rerun Part numbers: {plan.get('rerun_part_numbers', [])}",
                   f"- Publication resume position: {plan.get('publication_resume_position')}"]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write("\n".join(lines) + "\n")
          print(" | ".join(lines[2:]))
          PY
      - name: Preserve the verified cross-run resume bundle
        uses: actions/upload-artifact@v4
        with:
          name: resume-plan
          path: resume_bundle/
          if-no-files-found: error
          retention-days: 7

# ─────────────────────────────────────────────────────────────
# Pre-scrape Stage: 若來源網站具備 Cloudflare 防護（如 69書吧），
# 先於 host VM 上啟動虛擬螢幕以 SeleniumBase UC 抓取原始文字
# ─────────────────────────────────────────────────────────────
  scrape_chapters:
    name: "🕷️ Scrape — Worker ${{ matrix.worker_id }} (Ch ${{ matrix.start_chap }}~${{ matrix.end_chap }})"
    needs: [setup, resume_planner]
    if: needs.setup.outputs.needs_browser_scrape == 'true' && needs.resume_planner.result == 'success' && needs.resume_planner.outputs.publication_complete != 'true' && needs.resume_planner.outputs.mode != 'publication' && needs.resume_planner.outputs.mode != 'final_merge'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 17
      matrix: ${{ fromJSON(needs.resume_planner.outputs.worker_matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install seleniumbase beautifulsoup4 pyyaml requests curl_cffi
      - name: Download shared config
        uses: actions/download-artifact@v4
        with:
          name: shared-config
      - name: Download planner-validated partial worker checkpoint
        uses: actions/download-artifact@v4
        with:
          name: resume-plan
          path: resume_bundle
      - name: Validate and restore only the locked failed Run
        id: artifact_restore
        run: |
          python src/worker_pipeline.py \
            --stage restore_artifact \
            --worker-id ${{ matrix.worker_id }} \
            --artifact-dir "resume_bundle/workers/video-worker-${{ matrix.worker_id }}" \
            --source-config config.yaml \
            --source-run-id "${{ needs.resume_planner.outputs.source_run_id }}"
      - name: Scrape Assigned Chapters via SeleniumBase UC
        if: steps.artifact_restore.outputs.complete != 'true'
        run: |
          xvfb-run -a python src/worker_pipeline.py --stage crawl --worker-id ${{ matrix.worker_id }}
      - name: Upload RawText Checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: raw-worker-${{ matrix.worker_id }}
          path: Workspace/
          if-no-files-found: ignore

# ─────────────────────────────────────────────────────────────
# Worker Pipeline: 並行獨立處理各 Worker 的章節 (一條龍 End-to-End)
# ─────────────────────────────────────────────────────────────
  process_chapters:
    name: "⚡ Worker ${{ matrix.worker_id }} (Ch ${{ matrix.start_chap }}~${{ matrix.end_chap }})"
    needs: [setup, resume_planner, scrape_chapters]
    if: |
      always() &&
      needs.setup.result == 'success' &&
      needs.resume_planner.result == 'success' &&
      (needs.scrape_chapters.result == 'success' || needs.scrape_chapters.result == 'skipped') &&
      needs.resume_planner.outputs.publication_complete != 'true' &&
      needs.resume_planner.outputs.mode != 'publication' &&
      needs.resume_planner.outputs.mode != 'final_merge'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/hub-google/audiobook-worker@sha256:8c6b974d2a62daa17234d0d05729db071c9bbb75ca88dbd18964f6f2cf7e7fb0
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.setup.outputs.source_max_parallel || '1') }}
      matrix: ${{ fromJSON(needs.resume_planner.outputs.worker_matrix) }}

    steps:
      - uses: actions/checkout@v4
      - name: Download shared config
        uses: actions/download-artifact@v4
        with:
          name: shared-config

      - name: Download planner-validated partial worker checkpoint
        uses: actions/download-artifact@v4
        with:
          name: resume-plan
          path: resume_bundle

      - name: Validate and restore only the locked failed Run
        id: artifact_restore
        run: |
          python src/worker_pipeline.py \
            --stage restore_artifact \
            --worker-id ${{ matrix.worker_id }} \
            --artifact-dir "resume_bundle/workers/video-worker-${{ matrix.worker_id }}" \
            --source-config config.yaml \
            --source-run-id "${{ needs.resume_planner.outputs.source_run_id }}"

      - name: Restore Cache only when artifact is absent or incomplete
        if: steps.artifact_restore.outputs.complete != 'true'
        uses: actions/cache/restore@v4
        with:
          path: Workspace/
          key: ${{ needs.setup.outputs.book_profile_id }}-${{ matrix.book_title }}-chap${{ matrix.start_chap }}-${{ matrix.end_chap }}-worker${{ matrix.worker_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ needs.setup.outputs.book_profile_id }}-${{ matrix.book_title }}-chap${{ matrix.start_chap }}-${{ matrix.end_chap }}-worker${{ matrix.worker_id }}-

      - name: Log Cache Location
        run: |
          echo "=================================================="
          echo "📂 斷點續傳快取路徑 (Cache Location):"
          echo "   • 虛擬機工作目錄: Workspace/"
          echo "   • 雲端快取管理頁: https://github.com/${{ github.repository }}/actions/caches"
          echo "=================================================="

      - name: Download scraped raw texts
        if: needs.setup.outputs.needs_browser_scrape == 'true' && steps.artifact_restore.outputs.complete != 'true'
        uses: actions/download-artifact@v4
        with:
          name: raw-worker-${{ matrix.worker_id }}
          path: Workspace/

      - name: Run Per-Chapter End-to-End Pipeline (Real-Time Saving)
        if: steps.artifact_restore.outputs.complete != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QUEUE_TASK_ID: ${{ github.event.inputs.queue_task_id }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          RESUME_SOURCE_RUN_ID: ${{ needs.resume_planner.outputs.source_run_id || github.run_id }}
        run: |
          # Network-facing stages already implement their own bounded retries.
          # Retrying the whole worker repeats deterministic validation failures
          # and obscures the original error with duplicate tracebacks.
          python src/worker_pipeline.py --stage pipeline --worker-id ${{ matrix.worker_id }} --batch-size 1

      - name: Save Worker Workspace Checkpoint
        if: always()
        uses: actions/cache/save@v4
        with:
          path: Workspace/
          key: ${{ needs.setup.outputs.book_profile_id }}-${{ matrix.book_title }}-chap${{ matrix.start_chap }}-${{ matrix.end_chap }}-worker${{ matrix.worker_id }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload worker manifest (Fast Part Planning)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: manifest-worker-${{ matrix.worker_id }}
          path: Workspace/*/Manifests/manifest-worker-${{ matrix.worker_id }}.json
          if-no-files-found: error

      - name: Upload MP4 Videos & Subtitles Only (Lightweight Artifact for YouTube Upload)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mp4-worker-${{ matrix.worker_id }}
          path: |
            Workspace/*/Video/
            Workspace/*/Subtitles/
            Workspace/*/SourceStatus/
            Workspace/*/Manifests/
            Upload_Subtitles/
          if-no-files-found: error

      - name: Upload full worker workspace artifact (attempt 1/3)
        id: full_workspace_upload_1
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: video-worker-${{ matrix.worker_id }}
          path: Workspace/
          if-no-files-found: error
          compression-level: 0

      - name: Retry full worker workspace artifact (attempt 2/3)
        id: full_workspace_upload_2
        if: always() && steps.full_workspace_upload_1.outcome == 'failure'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: video-worker-${{ matrix.worker_id }}
          path: Workspace/
          if-no-files-found: error
          compression-level: 0
          overwrite: true

      - name: Retry full worker workspace artifact (attempt 3/3, strict)
        if: always() && steps.full_workspace_upload_2.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: video-worker-${{ matrix.worker_id }}
          path: Workspace/
          if-no-files-found: error
          compression-level: 0
          overwrite: true

      - name: Worker Job Summary
        if: always()
        timeout-minutes: 5
        env:
          WORKER_ID: ${{ matrix.worker_id }}
          START_CHAP: ${{ matrix.start_chap }}
          END_CHAP: ${{ matrix.end_chap }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ ! -f "config.yaml" ]; then
            echo "## Worker $WORKER_ID Pipeline Status" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "- Overall: **FAILED**" >> "$GITHUB_STEP_SUMMARY"
            echo "- Job status: **$JOB_STATUS**" >> "$GITHUB_STEP_SUMMARY"
            echo "- Resume point: **setup/download config**" >> "$GITHUB_STEP_SUMMARY"
            echo "- Reason: config.yaml is unavailable; inspect the first failed setup step." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python - <<'PY'
          import os
          import yaml
          from src.pipeline_checkpoint import PipelineCheckpoint
          from src.worker_pipeline import build_stage_settings, extract_chapter_sources

          with open("config.yaml", encoding="utf-8") as config_file:
              config = yaml.safe_load(config_file)
          book_title = config["book_title"]
          from src.source_identity import workspace_name
          workspace = os.path.abspath(os.path.join(config["paths"]["workspace_base"], workspace_name(config)))
          worker_id = int(os.environ["WORKER_ID"])
          per_worker = int(config["chapters_per_worker"])
          start = worker_id * per_worker
          chapters = config["selected_indices"][start:start + per_worker]
          sources = extract_chapter_sources(config)
          checkpoint = PipelineCheckpoint(
              workspace, book_title, worker_id, chapters,
              cleaner_fingerprint=(config.get("cleaner") or {}).get("fingerprint", ""),
              stage_settings=build_stage_settings(config),
              validation_cache_enabled=(config.get("validation") or {}).get("cache_enabled", True),
              chapter_sources=sources,
              source_chapter_sources=sources,
          )
          incomplete = checkpoint.incomplete_chapters()
          missing = checkpoint.source_missing_chapters()
          print("[RUN_SUMMARY] " + __import__("json").dumps({
              "kind": "worker", "worker": worker_id,
              "completed": len(chapters) - len(incomplete) - len(missing),
              "total": len(chapters),
              "incomplete": incomplete,
              "source_missing": missing,
          }, ensure_ascii=False))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(checkpoint.markdown_summary())
          PY

# ─────────────────────────────────────────────────────────────
# Plan and merge every Part before any external publication
# ─────────────────────────────────────────────────────────────
  plan_parts:
    name: "🧭 Lock the complete Part plan"
    needs: [setup, resume_planner, process_chapters]
    if: always() && github.event_name == 'workflow_dispatch' && needs.setup.result == 'success' && needs.resume_planner.result == 'success' && needs.resume_planner.outputs.publication_complete != 'true' && (needs.process_chapters.result == 'success' || needs.process_chapters.result == 'skipped')
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/hub-google/audiobook-worker@sha256:8c6b974d2a62daa17234d0d05729db071c9bbb75ca88dbd18964f6f2cf7e7fb0
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      matrix: ${{ needs.resume_planner.outputs.has_plan == 'true' && needs.resume_planner.outputs.merge_matrix || steps.plan.outputs.matrix }}
      part_count: ${{ steps.restore_plan.outputs.part_count || steps.plan.outputs.part_count }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Download locked source configuration
        uses: actions/download-artifact@v4
        with:
          name: shared-config
          path: prepared_source
      - name: Download planner-validated resume data
        uses: actions/download-artifact@v4
        with:
          name: resume-plan
          path: resume_bundle

      - name: Validate and restore locked failed Run Part plan
        id: restore_plan
        if: needs.resume_planner.outputs.has_plan == 'true'
        run: |
          python src/prepare_parts.py --mode restore-plan \
            --source-dir resume_bundle/prepared-plan \
            --config prepared_source/config.yaml \
            --output-dir prepared_plan \
            --github-output "$GITHUB_OUTPUT"

      - name: Download current Run worker artifacts for combined inventory
        if: needs.resume_planner.outputs.has_plan != 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: mp4-worker-*
          path: current_worker_inputs

      - name: Inventory every chapter and lock the complete plan
        id: plan
        if: needs.resume_planner.outputs.has_plan != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p combined_worker_inputs
          if [ -d resume_bundle/workers ]; then cp -a resume_bundle/workers/. combined_worker_inputs/; fi
          # Current workers are downloaded in the preceding action step.
          if [ -d current_worker_inputs ]; then cp -a current_worker_inputs/. combined_worker_inputs/; fi
          for attempt in 1 2 3; do
            echo "Inventory and plan attempt $attempt/3"
            if python src/prepare_parts.py \
              --mode plan \
              --run-id "${{ github.run_id }}" \
              --repo "${{ github.repository }}" \
              --config prepared_source/config.yaml \
              --artifact-dir combined_worker_inputs \
              --output-dir prepared_plan \
              --work-dir temp_part_inventory \
              --github-output "$GITHUB_OUTPUT"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Inventory and plan failed after 3 attempts"
              exit 1
            fi
            sleep 15
          done
      - name: Publish immutable Part plan
        uses: actions/upload-artifact@v4
        with:
          name: prepared-plan
          path: prepared_plan/
          if-no-files-found: error
          retention-days: 7

  merge_parts:
    name: "🧩 Merge worker ${{ matrix.merge_worker_id }} — Parts ${{ matrix.part_numbers }}"
    needs: [resume_planner, plan_parts, process_chapters]
    if: always() && needs.resume_planner.result == 'success' && needs.plan_parts.result == 'success' && needs.resume_planner.outputs.publication_complete != 'true' && needs.resume_planner.outputs.mode != 'publication' && needs.resume_planner.outputs.mode != 'final_merge'
    strategy:
      fail-fast: false
      max-parallel: 17
      matrix: ${{ fromJSON(needs.plan_parts.outputs.matrix) }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/hub-google/audiobook-worker@sha256:8c6b974d2a62daa17234d0d05729db071c9bbb75ca88dbd18964f6f2cf7e7fb0
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: prepared-plan
          path: prepared_plan
      - uses: actions/download-artifact@v4
        with:
          name: resume-plan
          path: resume_inputs
      - name: Download newly completed worker media
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: mp4-worker-*
          path: resume_inputs/current-workers
      - name: Merge only assigned locked Parts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_ARCHIVE_REPO: ${{ vars.HF_ARCHIVE_REPO }}
        run: |
          for attempt in 1 2 3; do
            echo "Merge parts attempt $attempt/3"
            if python src/prepare_parts.py \
              --mode merge \
              --repo "${{ github.repository }}" \
              --plan prepared_plan/parts-plan.json \
              --part-numbers "${{ matrix.part_numbers }}" \
              --output-dir prepared_parts \
              --artifact-dir resume_inputs \
              --work-dir temp_merge_worker; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Merge parts failed after 3 attempts"
              exit 1
            fi
            sleep 20
          done
      - name: Publish lightweight subtitles and MP4 verification sidecars
        uses: actions/upload-artifact@v4
        with:
          name: merge-result-${{ matrix.merge_worker_id }}
          path: |
            prepared_parts/*.srt
            prepared_parts/shard-manifest-*.json
          if-no-files-found: error
          retention-days: 7

  final_merge:
    name: "🔒 Validate complete Final Merge"
    needs: [resume_planner, plan_parts, merge_parts]
    if: always() && needs.resume_planner.result == 'success' && needs.resume_planner.outputs.publication_complete != 'true' && needs.plan_parts.result == 'success' && (needs.merge_parts.result == 'success' || needs.merge_parts.result == 'skipped')
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/hub-google/audiobook-worker@sha256:8c6b974d2a62daa17234d0d05729db071c9bbb75ca88dbd18964f6f2cf7e7fb0
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: prepared-plan
          path: prepared_plan
      - uses: actions/download-artifact@v4
        with:
          name: resume-plan
          path: resume_bundle
      - name: Download newly merged Parts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: merge-result-*
          path: current_merge_results
      - name: Reuse or create the complete Final Merge manifest
        env:
          RESUME_MODE: ${{ needs.resume_planner.outputs.mode }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_ARCHIVE_REPO: ${{ vars.HF_ARCHIVE_REPO }}
        run: |
          if [ "$RESUME_MODE" = "publication" ]; then
            cp -a resume_bundle/final-merge/. final_merge/
            python - <<'PY'
          import json
          from src.resume_planner import validate_final_merge
          plan = json.load(open("prepared_plan/parts-plan.json", encoding="utf-8"))
          validate_final_merge("final_merge", plan)
          PY
          else
            mkdir -p all_merge_results
            if [ -d resume_bundle/merge-results ]; then cp -a resume_bundle/merge-results/. all_merge_results/; fi
            if [ -d current_merge_results ]; then cp -a current_merge_results/. all_merge_results/; fi
            python src/resume_planner.py --build-final \
              --run-id "${{ github.run_id }}" \
              --plan prepared_plan/parts-plan.json \
              --sidecar-dir all_merge_results \
              --output-dir final_merge
          fi
      - name: Publish verified Final Merge artifact
        uses: actions/upload-artifact@v4
        with:
          name: final-merge
          path: final_merge/
          if-no-files-found: error
          retention-days: 7

# ─────────────────────────────────────────────────────────────
# Ordered HF and YouTube publisher; this job never merges chapters
# ─────────────────────────────────────────────────────────────
  upload_to_youtube:
    name: "📤 Ordered HF + YouTube publication"
    needs: [setup, resume_planner, process_chapters, plan_parts, merge_parts, final_merge]
    # Scheduled runs only check whether the latest manual run needs a retry.
    # They do not create worker artifacts, so never start the uploader for them.
    if: always() && github.event_name == 'workflow_dispatch' && needs.setup.result == 'success' && needs.resume_planner.result == 'success' && needs.resume_planner.outputs.publication_complete != 'true' && needs.final_merge.result == 'success'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/hub-google/audiobook-worker@sha256:8c6b974d2a62daa17234d0d05729db071c9bbb75ca88dbd18964f6f2cf7e7fb0
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Restore latest YouTube upload checkpoint
        uses: actions/cache/restore@v4
        with:
          path: |
            upload_resume_state/
            Workspace/*/Cover/
            Upload_Subtitles/
          key: youtube-upload-state-task-${{ github.event.inputs.queue_task_id || needs.resume_planner.outputs.source_run_id || github.run_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            youtube-upload-state-task-${{ github.event.inputs.queue_task_id || needs.resume_planner.outputs.source_run_id || github.run_id }}-

      - name: Restore planner-validated publication checkpoint
        uses: actions/download-artifact@v4
        with:
          name: resume-plan
          path: resume_bundle
      - name: Prefer the verified artifact checkpoint over cache
        run: |
          if [ -d resume_bundle/publication ]; then
            mkdir -p upload_resume_state
            cp -a resume_bundle/publication/. upload_resume_state/
          fi

      - name: Download immutable Part plan
        uses: actions/download-artifact@v4
        with:
          name: prepared-plan
          path: prepared_plan

      - name: Download locked source configuration
        uses: actions/download-artifact@v4
        with:
          name: shared-config
          path: prepared_source

      - name: Validate and normalize restored YouTube upload checkpoint
        if: hashFiles('upload_resume_state/state.json') != ''
        env:
          QUEUE_TASK_ID: ${{ github.event.inputs.queue_task_id }}
          EXECUTION_RUN_ID: ${{ github.run_id }}
          SOURCE_RUN_ID: ${{ needs.resume_planner.outputs.source_run_id || github.run_id }}
        run: |
          python - <<'PY'
          import json, os, sys, yaml
          from src.publication_checkpoint import PublicationCheckpoint, plan_structure_fingerprint
          from src.youtube_upload.state import load_resume_state

          state_file = "upload_resume_state/state.json"
          state = load_resume_state(state_file)
          if not state:
              sys.exit(0)

          config_path = "prepared_source/config.yaml"
          book_profile_id = ""
          if os.path.exists(config_path):
              with open(config_path, encoding="utf-8") as f:
                  cfg = yaml.safe_load(f) or {}
                  book_profile_id = str(cfg.get("book_profile_id") or "").strip()

          if book_profile_id and state.get("book_profile_id") and str(state["book_profile_id"]).strip() != book_profile_id:
              print(f"::error title=Checkpoint rejected::Checkpoint book_profile_id {state['book_profile_id']!r} != expected {book_profile_id!r}")
              sys.exit(1)

          plan_path = "prepared_plan/parts-plan.json"
          if os.path.exists(plan_path) and state.get("part_plan"):
              with open(plan_path, encoding="utf-8") as f:
                  locked = json.load(f)
              expected_fp = plan_structure_fingerprint(locked.get("parts", []))
              actual_fp = plan_structure_fingerprint(state["part_plan"])
              if expected_fp != actual_fp:
                  print("::error title=Checkpoint rejected::part_plan fingerprint differs from current prepared plan")
                  sys.exit(1)

          publication = PublicationCheckpoint(state_file)
          if publication.is_locked():
              valid, reason = publication.validate_task_identity(book_profile_id=book_profile_id)
              if not valid:
                  print(f"::error title=Checkpoint rejected::{reason}")
                  sys.exit(1)

          print("Restored YouTube upload checkpoint validated successfully.")
          PY

      - name: Restore verified manual cover when configured
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          for attempt in 1 2 3; do
            echo "Restore manual cover attempt $attempt/3"
            if python src/cover_assets.py --restore-config prepared_source/config.yaml; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Restore manual cover failed after 3 attempts"
              exit 1
            fi
            sleep 10
          done

      - name: Download Final Merge subtitles and verification sidecars
        uses: actions/download-artifact@v4
        with:
          name: final-merge
          path: prepared_sidecars

      - name: Fetch and verify merge-complete Parts from HF
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_ARCHIVE_REPO: ${{ vars.HF_ARCHIVE_REPO }}
        run: |
          for attempt in 1 2 3; do
            echo "Fetch Parts from HF attempt $attempt/3"
            if python src/prepare_parts.py \
              --mode fetch \
              --plan prepared_plan/parts-plan.json \
              --sidecar-dir prepared_sidecars \
              --output-dir prepared_parts; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Fetch Parts from HF failed after 3 attempts"
              exit 1
            fi
            sleep 20
          done

      - name: Run YouTube API Uploader
        env:
          YOUTUBE_REFRESH_TOKEN_1: ${{ secrets.YOUTUBE_REFRESH_TOKEN_1 }}
          YOUTUBE_CLIENT_ID_1: ${{ secrets.YOUTUBE_CLIENT_ID_1 }}
          YOUTUBE_CLIENT_SECRET_1: ${{ secrets.YOUTUBE_CLIENT_SECRET_1 }}
          YOUTUBE_REFRESH_TOKEN_2: ${{ secrets.YOUTUBE_REFRESH_TOKEN_2 }}
          YOUTUBE_CLIENT_ID_2: ${{ secrets.YOUTUBE_CLIENT_ID_2 }}
          YOUTUBE_CLIENT_SECRET_2: ${{ secrets.YOUTUBE_CLIENT_SECRET_2 }}
          YOUTUBE_REFRESH_TOKEN_3: ${{ secrets.YOUTUBE_REFRESH_TOKEN_3 }}
          YOUTUBE_CLIENT_ID_3: ${{ secrets.YOUTUBE_CLIENT_ID_3 }}
          YOUTUBE_CLIENT_SECRET_3: ${{ secrets.YOUTUBE_CLIENT_SECRET_3 }}
          YOUTUBE_REFRESH_TOKEN_4: ${{ secrets.YOUTUBE_REFRESH_TOKEN_4 }}
          YOUTUBE_CLIENT_ID_4: ${{ secrets.YOUTUBE_CLIENT_ID_4 }}
          YOUTUBE_CLIENT_SECRET_4: ${{ secrets.YOUTUBE_CLIENT_SECRET_4 }}
          YOUTUBE_REFRESH_TOKEN_5: ${{ secrets.YOUTUBE_REFRESH_TOKEN_5 }}
          YOUTUBE_CLIENT_ID_5: ${{ secrets.YOUTUBE_CLIENT_ID_5 }}
          YOUTUBE_CLIENT_SECRET_5: ${{ secrets.YOUTUBE_CLIENT_SECRET_5 }}
          YOUTUBE_REFRESH_TOKEN_6: ${{ secrets.YOUTUBE_REFRESH_TOKEN_6 }}
          YOUTUBE_CLIENT_ID_6: ${{ secrets.YOUTUBE_CLIENT_ID_6 }}
          YOUTUBE_CLIENT_SECRET_6: ${{ secrets.YOUTUBE_CLIENT_SECRET_6 }}
          YOUTUBE_REFRESH_TOKEN_7: ${{ secrets.YOUTUBE_REFRESH_TOKEN_7 }}
          YOUTUBE_CLIENT_ID_7: ${{ secrets.YOUTUBE_CLIENT_ID_7 }}
          YOUTUBE_CLIENT_SECRET_7: ${{ secrets.YOUTUBE_CLIENT_SECRET_7 }}
          YOUTUBE_REFRESH_TOKEN_8: ${{ secrets.YOUTUBE_REFRESH_TOKEN_8 }}
          YOUTUBE_CLIENT_ID_8: ${{ secrets.YOUTUBE_CLIENT_ID_8 }}
          YOUTUBE_CLIENT_SECRET_8: ${{ secrets.YOUTUBE_CLIENT_SECRET_8 }}
          YOUTUBE_REFRESH_TOKEN_9: ${{ secrets.YOUTUBE_REFRESH_TOKEN_9 }}
          YOUTUBE_CLIENT_ID_9: ${{ secrets.YOUTUBE_CLIENT_ID_9 }}
          YOUTUBE_CLIENT_SECRET_9: ${{ secrets.YOUTUBE_CLIENT_SECRET_9 }}
          YOUTUBE_REFRESH_TOKEN_10: ${{ secrets.YOUTUBE_REFRESH_TOKEN_10 }}
          YOUTUBE_CLIENT_ID_10: ${{ secrets.YOUTUBE_CLIENT_ID_10 }}
          YOUTUBE_CLIENT_SECRET_10: ${{ secrets.YOUTUBE_CLIENT_SECRET_10 }}
          YOUTUBE_EXPECTED_ACCOUNT_COUNT: "10"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_ARCHIVE_REPO: ${{ vars.HF_ARCHIVE_REPO }}
          HF_MEDIA_PREUPLOADED: "true"
          QUEUE_TASK_ID: ${{ github.event.inputs.queue_task_id }}
          BOOK_CATALOG_URL: ${{ github.event.inputs.catalog_url }}
          # A rerun initiated in the Actions UI may probe YouTube before the
          # saved retry_at. Automatic reruns are initiated by github-actions.
          # Resuming a failed run must never imply permission to bypass a
          # channel-wide cooldown. Only the dispatcher's explicit force input
          # may do that.
          MANUAL_YOUTUBE_RETRY: "false"

        run: |
          for attempt in 1 2 3; do
            echo "YouTube uploader attempt $attempt/3"
            set +e
            python src/youtube_api_uploader.py --run-id "${{ needs.resume_planner.outputs.source_run_id || github.run_id }}" --source-run-id "${{ needs.resume_planner.outputs.source_run_id || github.run_id }}" --execution-run-id "${{ github.run_id }}" --input-dir prepared_parts --task-id "${{ github.event.inputs.queue_task_id }}" --repo "${{ github.repository }}" --privacy "public" --state-file upload_resume_state/state.json
            code=$?
            set -e

            if [ "$code" -eq 0 ]; then exit 0; fi
            if [ "$code" -eq 75 ]; then
              reason=$(python -c 'import json; print(json.load(open("upload_resume_state/state.json", encoding="utf-8")).get("reason") or "retryable YouTube API failure")' 2>/dev/null || echo "retryable YouTube API failure")
              retry_at=$(python -c 'import json; print(json.load(open("upload_resume_state/state.json", encoding="utf-8")).get("retry_at") or "unknown")' 2>/dev/null || echo "unknown")
              echo "::error title=YouTube upload paused::$reason; checkpoint preserved; retry after $retry_at"
              echo "⏸️ YouTube daily limit: **$reason**. Checkpoint preserved; retry after **$retry_at**." >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "YouTube uploader failed with exit code $code; retrying in 30s..."
              sleep 30
            else
              echo "::error title=YouTube publication code failure::reason=permanentFailure; checkpoint preserved; fix the code or data before retrying"
              echo "❌ YouTube publication failed with exit code **$code** after 3 attempts. Checkpoint preserved." >> "$GITHUB_STEP_SUMMARY"
              exit "$code"
            fi
          done

      - name: Enforce strict publication evidence
        env:
          SOURCE_RUN_ID: ${{ needs.resume_planner.outputs.source_run_id || github.run_id }}
          EXECUTION_RUN_ID: ${{ github.run_id }}
          BOOK_PROFILE_ID: ${{ steps.gen_matrix.outputs.book_profile_id || needs.setup.outputs.book_profile_id }}
        run: |
          python - <<'PY'
          import os
          from src.success_criteria import validate_upload_success

          result = validate_upload_success(
              "upload_resume_state/state.json",
              expected_run_id=os.environ.get("SOURCE_RUN_ID"),
              execution_run_id=os.environ.get("EXECUTION_RUN_ID"),
              expected_book_profile_id=os.environ.get("BOOK_PROFILE_ID"),
          )
          print(
              "Strict success gate passed: "
              f"{result['parts']} Parts published to {result['playlist_url']}"
          )
          PY

      - name: Generate Job Summary
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from src.publication_checkpoint import PublicationCheckpoint
          
          state_file = "upload_resume_state/state.json"
          if not os.path.exists(state_file):
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
                  f.write("## YouTube Upload Status\nNo state file found.\n")
              exit(0)
              
          with open(state_file, encoding="utf-8") as f:
              state = json.load(f)
          hf_state_file = "upload_resume_state/hf_archive_state.json"
          hf_state = {}
          if os.path.exists(hf_state_file):
              with open(hf_state_file, encoding="utf-8") as f:
                  hf_state = json.load(f)
              
          done = len(state.get("completed_titles", []))
          total = len(state.get("part_plan", [])) or max(done, 1)
          pending = len(state.get("pending_thumbnails", {}))
          pending_playlist = len(state.get("pending_playlist", {}))
          pending_captions = len(state.get("pending_captions", {}))
          pending_publish = len(state.get("pending_publish", {}))
          viewer_gate = state.get("final_playlist_validation") or {}
          status = state.get("status", "unknown")
          publication = PublicationCheckpoint(state_file)
          book_title = publication.data.get("book_title", "")
          books = hf_state.get("books", {})
          hf_repo = hf_state.get("repo_id", "尚未建立")
          hf_book_key = publication.data.get('source_fingerprint') or book_title
          current_hf_book = books.get(hf_book_key, {}) if hf_book_key else {}
          hf_parts = (current_hf_book.get("parts") or {}).values()
          hf_done = sum(item.get("status") == "complete" for item in hf_parts)
          print("[RUN_SUMMARY] " + json.dumps({
              "kind": "youtube", "status": status, "completed": done, "total": total,
              "pending_thumbnails": pending, "pending_playlist": pending_playlist,
              "pending_captions": pending_captions, "pending_publish": pending_publish,
              "reason": state.get("reason"), "retry_at": state.get("retry_at"),
              "playlist_url": state.get("playlist_url"),
              "viewer_playlist_gate": viewer_gate.get("status", "missing"),
              "viewer_playlist_items": viewer_gate.get("item_count", 0),
              "viewer_playlist_order": viewer_gate.get("ordered_parts", []),
          }, ensure_ascii=False))
          
          status_icon = "⏸️"
          if status == "complete": status_icon = "🎉"
          elif status == "failed": status_icon = "❌"
          elif status == "unknown": status_icon = "⚠️"
          
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write(f"## {status_icon} YouTube Upload Status: {status.upper()}\n\n")
              f.write(f"| 項目 | 狀態資訊 |\n|---|---|\n")
              f.write(f"| **任務進度** | **{done} / {total} Parts** ({done/total*100:.1f}%) |\n")
              f.write(f"| **Pending Thumbnails** | **{pending}** |\n")
              f.write(f"| **Pending Playlist Inserts** | **{pending_playlist}** |\n")
              f.write(f"| **Pending CC Captions** | **{pending_captions}** |\n")
              f.write(f"| **Pending Final Publish** | **{pending_publish}** |\n")
              f.write(f"| **使用者最終播放清單驗收** | **{viewer_gate.get('status', 'missing').upper()}** |\n")
              f.write(f"| **播放清單實際項目數** | **{viewer_gate.get('item_count', 0)}** |\n")
              f.write(f"| **Part 排序** | **{viewer_gate.get('ordered_parts', [])}** |\n")
              f.write(f"| **Current Book Hugging Face Parts** | **{hf_done} / {total}** |\n")
              if not book_title:
                  f.write("| **Hugging Face Summary Warning** | `本次 checkpoint 缺少 book_title，無法統計本書 HF Parts` |\n")
              f.write(f"| **Hugging Face Repo** | `{hf_repo}` |\n")
              if "reason" in state and state["reason"]:
                  f.write(f"| **Reason** | `{state['reason']}` |\n")
              if "retry_at" in state and state["retry_at"]:
                  f.write(f"| **Retry After** | `{state['retry_at']}` |\n")
                  
              playlist_url = state.get("playlist_url")
              if playlist_url and playlist_url.startswith("http"):
                  f.write(f"| **播放清單** | [點此開啟 YouTube 播放清單]({playlist_url}) |\n")
              f.write("\n")
              f.write(publication.markdown_summary())
          PY

      - name: Save YouTube upload checkpoint
        if: always() && hashFiles('upload_resume_state/state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: |
            upload_resume_state/
            Workspace/*/Cover/
            Upload_Subtitles/
          key: youtube-upload-state-task-${{ github.event.inputs.queue_task_id || needs.resume_planner.outputs.source_run_id || github.run_id }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Preserve YouTube upload checkpoint for the next run
        if: always() && hashFiles('upload_resume_state/state.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: youtube-upload-checkpoint
          path: upload_resume_state/
          if-no-files-found: error

      # The merge GUI must reuse the exact title source and thumbnail that this
      # run used.  Keep them as a normal Actions artifact (not only a cache), so
      # another workflow can retrieve them by source Run ID.
      - name: Preserve original book name and YouTube covers for merging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-book-metadata
          path: |
            config.yaml
            Workspace/*/Part_*/youtube_cover.jpg
            Workspace/*/youtube_cover.jpg
          if-no-files-found: warn

  strict_success_gate:
    name: "Strict final success gate"
    if: always() && github.event_name == 'workflow_dispatch'
    needs: [setup, resume_planner, process_chapters, plan_parts, merge_parts, final_merge, upload_to_youtube]
    runs-on: ubuntu-latest
    steps:
      - name: Require every production job to succeed
        env:
          SETUP_RESULT: ${{ needs.setup.result }}
          PLANNER_RESULT: ${{ needs.resume_planner.result }}
          PUBLICATION_COMPLETE: ${{ needs.resume_planner.outputs.publication_complete }}
          WORKERS_RESULT: ${{ needs.process_chapters.result }}
          PLAN_RESULT: ${{ needs.plan_parts.result }}
          MERGE_RESULT: ${{ needs.merge_parts.result }}
          FINAL_MERGE_RESULT: ${{ needs.final_merge.result }}
          YOUTUBE_RESULT: ${{ needs.upload_to_youtube.result }}
        run: |
          echo "## Strict final success gate" >> "$GITHUB_STEP_SUMMARY"
          echo "- Setup: **$SETUP_RESULT**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Resume Planner: **$PLANNER_RESULT**" >> "$GITHUB_STEP_SUMMARY"
          echo "- All chapter workers: **$WORKERS_RESULT**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Complete Part plan: **$PLAN_RESULT**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Parallel Part merge and HF media upload: **$MERGE_RESULT**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Final Merge validation: **$FINAL_MERGE_RESULT**" >> "$GITHUB_STEP_SUMMARY"
          echo "- YouTube video/subtitle/playlist publication: **$YOUTUBE_RESULT**" >> "$GITHUB_STEP_SUMMARY"
          if [ "$SETUP_RESULT" != "success" ] || [ "$PLANNER_RESULT" != "success" ]; then
            exit 1
          fi
          if [ "$PUBLICATION_COMPLETE" = "true" ]; then
            echo "✅ Planner verified that publication was already fully complete; no production job was repeated." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if { [ "$WORKERS_RESULT" != "success" ] && [ "$WORKERS_RESULT" != "skipped" ]; } || \
             [ "$PLAN_RESULT" != "success" ] || \
             { [ "$MERGE_RESULT" != "success" ] && [ "$MERGE_RESULT" != "skipped" ]; } || \
             [ "$FINAL_MERGE_RESULT" != "success" ] || [ "$YOUTUBE_RESULT" != "success" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "❌ The audiobook is incomplete. This run must remain failed." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ Every chapter and every required YouTube publication step completed." >> "$GITHUB_STEP_SUMMARY"
