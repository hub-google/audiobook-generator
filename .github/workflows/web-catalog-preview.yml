name: "章節目錄｜網頁即時解析"
run-name: "【章節目錄解析】任務 ${{ inputs.request_id }}"
on:
  workflow_dispatch:
    inputs:
      catalog_url: {description: Novel source URL, required: true, type: string}
      request_id: {description: Unique web request ID, required: true, type: string}
permissions:
  contents: write
jobs:
  preview:
    name: "解析小說目錄"
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip}
      - run: pip install -r requirements.txt
      - name: "解析小說章節目錄"
        env:
          CATALOG_URL: ${{ inputs.catalog_url }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: python -m tools.web_catalog_preview --url "$CATALOG_URL" --request-id "$REQUEST_ID"
      - name: "寫入章節預覽至狀態分支"
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_ID: ${{ inputs.request_id }}
        shell: bash
        run: |
          set -euo pipefail
          name="web-previews/${REQUEST_ID}.json"
          encoded="$(base64 -w0 catalog-preview.json)"
          for attempt in 1 2 3; do
            if gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$name" \
              -f message="Publish AUDIO catalog preview $REQUEST_ID" \
              -f branch=automation-state \
              -f content="$encoded"; then
              exit 0
            fi
            sleep "$attempt"
          done
          echo "Unable to publish catalog preview" >&2
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: catalog-preview-${{ inputs.request_id }}
          path: catalog-preview.json
          if-no-files-found: error
          retention-days: 1
