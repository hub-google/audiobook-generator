name: Build Audiobook Worker Image

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - Dockerfile.worker
      - requirements.txt
      - .github/workflows/build-worker-image.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: audiobook-worker-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx container driver
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.worker
          push: true
          tags: |
            ghcr.io/hub-google/audiobook-worker:v1
            ghcr.io/hub-google/audiobook-worker:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
