name: "工作環境建置｜製作機映像檔"
run-name: "【工作環境建置】更新小說製作機｜第 ${{ github.run_number }} 次"

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Dockerfile.worker
      - requirements.txt
      - .github/workflows/build-worker-image.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: audiobook-worker-image
  cancel-in-progress: false

jobs:
  build:
    name: "建置並發布工作機映像"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "設定 Docker 建置環境"
        uses: docker/setup-buildx-action@v3

      - name: "登入 GitHub 容器倉庫"
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "建置並發布工作機映像"
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.worker
          push: true
          tags: |
            ghcr.io/hub-google/audiobook-worker:v1
            ghcr.io/hub-google/audiobook-worker:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
