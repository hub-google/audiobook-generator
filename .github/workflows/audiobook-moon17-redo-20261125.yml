name: AUDIO｜修復月亮小說正文並重發新版 TXT
on:
  push:
    branches: [master]
    paths: ['.github/workflows/audiobook-moon17-redo-20261125.yml']
permissions:
  contents: write
  actions: write
jobs:
  retry_current_book:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      QUEUE_STATE_BRANCH: automation-state
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Cancel only broken TXT and wait for already-generating cover to complete
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/45592660691/cancel" || true
          for n in $(seq 1 72); do
            status="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/45592660691" --jq .status)"
            [ "$status" = "completed" ] && break
            sleep 5
          done
          [ "$status" = "completed" ] || { echo "::error::Old TXT still running"; exit 1; }
          for n in $(seq 1 240); do
            status="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/45592664172" --jq .status)"
            if [ "$status" = "completed" ]; then
              echo "Prior cover finished; preserving it when successful."
              exit 0
            fi
            if (( n % 12 == 0 )); then echo "Cover still in progress after $((n*5)) seconds"; fi
            sleep 5
          done
          echo "::error::Cover not completed within 20 minutes"; exit 1
      - name: Preserve successful cover and requeue ONLY failed TXT
        shell: bash
        run: |
          python - <<'PY'
          import requests,os,base64,json,datetime
          repo=os.environ['GITHUB_REPOSITORY']
          token=os.environ['GH_TOKEN']
          api=f"https://api.github.com/repos/{repo}"
          headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          session=requests.Session();session.headers.update(headers)
          cover=session.get(f"{api}/actions/runs/45592664172",timeout=25);cover.raise_for_status()
          result=cover.json()
          if result['status']!='completed':raise SystemExit('Cover remains active; not resetting')
          state=session.get(f"{api}/contents/audiobook-queue.json",params={'ref':'automation-state'},timeout=25);state.raise_for_status()
          blob=state.json();queue=json.loads(base64.b64decode(blob['content']))
          task=next(x for x in queue['queue'] if x['task_id']=='book-20261125-7fa2c918')
          if task.get('scrape_run_id') not in (None,45592660691) or (task.get('stages') or {}).get('scrape',{}).get('run_id') not in (None,45592660691):
              raise SystemExit('A newer TXT Run already exists; refusing to overwrite')
          if task.get('status')=='completed':raise SystemExit('Already completed; no rerun')
          clean={'status':'pending','run_id':None,'run_attempt':0,'reason':None,'completed_at':None}
          task['stages']['scrape']=dict(clean)
          if result['conclusion']=='success':
              task['stages']['cover']={'status':'completed','run_id':45592664172,'run_attempt':result.get('run_attempt',1),'reason':None,'completed_at':result.get('updated_at')}
              task['cover_run_id']=45592664172
              print('Preserved successful cover Run 45592664172')
          else:
              task['stages']['cover']=dict(clean)
              task['cover_run_id']=None
              print('Old cover did not succeed; new dispatcher will regenerate')
          task.update(status='queued',workflow_phase='preflight',run_id=None,scrape_run_id=None,processing_run_id=None,reason=None,retry_at=None,run_conclusion=None,dispatched_at=None)
          now=datetime.datetime.now(datetime.timezone.utc).isoformat()
          task['updated_at']=now
          queue['updated_at']=now
          queue['revision']=int(queue.get('revision',0))+1
          payload={'branch':'automation-state','sha':blob['sha'],'message':'Retry moon17 with verified Chrome HTTP client, retaining completed cover','content':base64.b64encode((json.dumps(queue,ensure_ascii=False,indent=2)+'\n').encode()).decode()}
          wrote=session.put(f"{api}/contents/audiobook-queue.json",json=payload,timeout=25);wrote.raise_for_status()
          print('Queued corrected Chrome-based TXT job, revision',queue['revision'])
          PY
      - name: Dispatch newest master Action and report new run IDs
        shell: bash
        run: |
          set -euo pipefail
          python -m src.queue_dispatcher --force
          python - <<'PY'
          import os,requests,time
          api=f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}"
          s=requests.Session();s.headers.update({'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          target='book-20261125-7fa2c918'
          for n in range(20):
              r=s.get(api+'/actions/runs?per_page=100',timeout=30);r.raise_for_status()
              runs=[x for x in r.json().get('workflow_runs',[]) if target in (x.get('display_title') or '') and '【TXT抓取】' in (x.get('display_title') or '') and int(x['id']) not in (45591363976,45592660691)]
              if runs:
                  run=max(runs,key=lambda x:x['id'])
                  print('NEW_TXT_RUN',run['id'],run['html_url'],run['head_sha'])
                  if run['head_sha']!=os.environ['GITHUB_SHA']:raise SystemExit('New Run is not using patched commit')
                  break
              time.sleep(10)
          else:
              raise SystemExit('Latest-master TXT workflow dispatch was not confirmed')
          PY
