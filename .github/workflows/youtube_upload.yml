name: Fast Upload Audiobooks & Build YouTube Playlist

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'GitHub Actions Run ID containing video worker artifacts (e.g. 29821206020)'
        required: false
        default: ''
      privacy:
        description: 'Video privacy status (public, unlisted, private)'
        required: true
        default: 'public'

permissions:
  contents: write
  actions: write

concurrency:
  group: youtube-resumable-upload
  cancel-in-progress: false

jobs:
  fast_api_upload:
    name: "📤 Fast Upload & Build Playlist"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: pip install -r requirements.txt

      - name: Install FFmpeg
        run: |
          sudo env DEBIAN_FRONTEND=noninteractive timeout 10m apt-get update -qq -o Acquire::Retries=3
          sudo env DEBIAN_FRONTEND=noninteractive timeout 10m apt-get install -y --no-install-recommends -o Acquire::Retries=3 -o DPkg::Lock::Timeout=60 ffmpeg

      - name: Restore latest YouTube upload checkpoint
        uses: actions/cache/restore@v4
        with:
          path: |
            upload_resume_state/
            Workspace/*/Cover/
            Upload_Subtitles/
          key: youtube-upload-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            youtube-upload-state-

      - name: Run Fast Upload & Playlist Builder
        id: uploader
        env:
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set +e
          python src/youtube_api_uploader.py \
            --run-id "${{ github.event.inputs.run_id }}" \
            --repo "${{ github.repository }}" \
            --privacy "${{ github.event.inputs.privacy || 'public' }}" \
            --state-file upload_resume_state/state.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -ne 0 ] && [ "$code" -ne 75 ]; then exit "$code"; fi
          exit "$code"

      - name: Generate Job Summary
        if: always()
        run: |
          python - <<'PY'
          import json, os
          
          state_file = "upload_resume_state/state.json"
          if not os.path.exists(state_file):
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
                  f.write("## YouTube Upload Status\nNo state file found.\n")
              exit(0)
              
          with open(state_file, encoding="utf-8") as f:
              state = json.load(f)
              
          done = len(state.get("completed_titles", []))
          total = len(state.get("part_plan", [])) or max(done, 1)
          pending = len(state.get("pending_thumbnails", {}))
          pending_playlist = len(state.get("pending_playlist", {}))
          pending_captions = len(state.get("pending_captions", {}))
          pending_publish = len(state.get("pending_publish", {}))
          status = state.get("status", "unknown")
          
          status_icon = "⏸️"
          if status == "complete": status_icon = "🎉"
          elif status == "failed": status_icon = "❌"
          elif status == "unknown": status_icon = "⚠️"
          
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write(f"## {status_icon} YouTube Upload Status: {status.upper()}\n\n")
              f.write(f"| 項目 | 狀態資訊 |\n|---|---|\n")
              f.write(f"| **任務進度** | **{done} / {total} Parts** ({done/total*100:.1f}%) |\n")
              f.write(f"| **Pending Thumbnails** | **{pending}** |\n")
              f.write(f"| **Pending Playlist Inserts** | **{pending_playlist}** |\n")
              f.write(f"| **Pending CC Captions** | **{pending_captions}** |\n")
              f.write(f"| **Pending Final Publish** | **{pending_publish}** |\n")
              if "reason" in state and state["reason"]:
                  f.write(f"| **Reason** | `{state['reason']}` |\n")
              if "retry_at" in state and state["retry_at"]:
                  f.write(f"| **Retry After** | `{state['retry_at']}` |\n")
                  
              playlist_url = state.get("playlist_url")
              if playlist_url and playlist_url.startswith("http"):
                  f.write(f"| **播放清單** | [點此開啟 YouTube 播放清單]({playlist_url}) |\n")
          PY

      - name: Auto-disable scheduled workflow on complete
        if: always() && steps.uploader.outputs.exit_code == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f "upload_resume_state/state.json" ]; then
            status=$(python -c 'import json; print(json.load(open("upload_resume_state/state.json")).get("status", "unknown"))' 2>/dev/null || echo "unknown")
            if [ "$status" = "complete" ]; then
              echo "All uploads completed! Disabling cron schedule..."
              gh workflow disable "youtube_upload.yml" || true
              echo "🛑 **Workflow schedule has been automatically disabled to save resources.**" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

      - name: Save YouTube upload checkpoint
        if: always() && hashFiles('upload_resume_state/state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: |
            upload_resume_state/
            Workspace/*/Cover/
            Upload_Subtitles/
          key: youtube-upload-state-${{ github.run_id }}-${{ github.run_attempt }}
