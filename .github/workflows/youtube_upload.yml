name: Fast Upload Audiobooks & Build YouTube Playlist

on:
  schedule:
    # GitHub cron is UTC. The uploader exits before retry_at without calling YouTube.
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      run_id:
        description: 'GitHub Actions Run ID containing video worker artifacts (e.g. 29821206020)'
        required: false
        default: ''
      privacy:
        description: 'Video privacy status (public, unlisted, private)'
        required: true
        default: 'public'

permissions:
  contents: read
  actions: read

concurrency:
  group: youtube-resumable-upload
  cancel-in-progress: false

jobs:
  fast_api_upload:
    name: "📤 Fast Upload & Build Playlist"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: pip install -r requirements.txt

      - name: Install FFmpeg & CJK Fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-noto-cjk fonts-wqy-zenhei

      - name: Restore latest YouTube upload checkpoint
        uses: actions/cache/restore@v4
        with:
          path: |
            upload_resume_state/
            Workspace/*/Cover/
          key: youtube-upload-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            youtube-upload-state-

      - name: Run Fast Upload & Playlist Builder
        id: uploader
        env:
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set +e
          python src/youtube_api_uploader.py \
            --run-id "${{ github.event.inputs.run_id }}" \
            --repo "${{ github.repository }}" \
            --privacy "${{ github.event.inputs.privacy || 'public' }}" \
            --state-file upload_resume_state/state.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 75 ]; then
            echo "## YouTube upload paused (incomplete)" >> "$GITHUB_STEP_SUMMARY"
            echo "Checkpoint saved. A scheduled run will resume after retry_at." >> "$GITHUB_STEP_SUMMARY"
            exit 75
          fi
          if [ "$code" -ne 0 ]; then exit "$code"; fi

      - name: Save YouTube upload checkpoint
        if: always() && hashFiles('upload_resume_state/state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: |
            upload_resume_state/
            Workspace/*/Cover/
          key: youtube-upload-state-${{ github.run_id }}-${{ github.run_attempt }}
