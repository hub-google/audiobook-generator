name: Audiobook Queue Dispatcher
run-name: "有聲小說佇列調度｜${{ github.event_name }}｜#${{ github.run_number }}"

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Audiobook Automation Pipeline (Parallel)"]
    types: [completed]
  schedule:
    - cron: "*/15 * * * *"

permissions:
  actions: write
  contents: write

concurrency:
  group: audiobook-queue-dispatcher
  cancel-in-progress: false

jobs:
  dispatch_once:
    runs-on: ubuntu-latest
    steps:
      - name: Delete older dispatcher run records
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh api --paginate "repos/$REPOSITORY/actions/workflows/queue-dispatcher.yml/runs?per_page=100" \
            --jq ".workflow_runs[] | select(.id < ($CURRENT_RUN_ID | tonumber)) | [.id, .status] | @tsv" |
          while IFS=$'\t' read -r old_run_id old_status; do
            [ -n "$old_run_id" ] || continue
            if [ "$old_status" != "completed" ]; then
              gh api --method POST "repos/$REPOSITORY/actions/runs/$old_run_id/cancel" || true
              continue
            fi
            gh api --method DELETE "repos/$REPOSITORY/actions/runs/$old_run_id"
            echo "Deleted older dispatcher run $old_run_id."
          done

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dispatcher dependencies
        run: pip install requests

      - name: Reconcile queue and perform one action
        id: dispatch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QUEUE_STATE_BRANCH: automation-state
        shell: bash
        run: |
          set -o pipefail
          python src/queue_dispatcher.py 2>&1 | tee dispatcher-result.txt

      - name: Write dispatcher result to job summary
        if: always()
        shell: bash
        env:
          DISPATCH_OUTCOME: ${{ steps.dispatch.outcome }}
        run: |
          if [ "$DISPATCH_OUTCOME" = "success" ]; then
            result_icon="✅"
            result_text="成功"
          else
            result_icon="❌"
            result_text="失敗"
          fi

          {
            echo "# 有聲小說佇列調度結果"
            echo
            echo "$result_icon **執行結果：$result_text**"
            echo
            echo "- 觸發方式：\`${{ github.event_name }}\`"
            echo "- 執行編號：[${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            echo "- 執行時間：\`$(date -u '+%Y-%m-%d %H:%M:%S UTC')\`"
            echo
            echo "## 調度訊息"
            echo
            if [ -s dispatcher-result.txt ]; then
              sed 's/^/    /' dispatcher-result.txt
            else
              echo "    調度步驟沒有產生輸出；請展開 job log 檢查前置步驟。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
