name: HF audiobook 24-hour upload resume scheduler
on:
  schedule:
    # Scan once per hour, offset from the top of the hour to reduce GitHub load delays.
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  actions: write
  contents: read
concurrency:
  group: hf-audiobook-resume-scheduler
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Delete older resume scheduler run records
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh api --paginate "repos/$REPOSITORY/actions/workflows/hf-upload-resume-scheduler.yml/runs?per_page=100" \
            --jq ".workflow_runs[] | select(.id != ($CURRENT_RUN_ID | tonumber)) | [.id, .status] | @tsv" |
          while IFS=$'\t' read -r old_run_id old_status; do
            [ -n "$old_run_id" ] || continue
            if [ "$old_status" != "completed" ]; then
              gh api --method POST "repos/$REPOSITORY/actions/runs/$old_run_id/cancel" || true
              for attempt in $(seq 1 15); do
                old_status="$(gh api "repos/$REPOSITORY/actions/runs/$old_run_id" --jq .status)"
                [ "$old_status" = "completed" ] && break
                sleep 2
              done
            fi
            if [ "$old_status" != "completed" ]; then
              echo "Older resume scheduler run $old_run_id is still stopping; it cannot be deleted yet."
              continue
            fi
            gh api --method DELETE "repos/$REPOSITORY/actions/runs/$old_run_id"
            echo "Deleted older resume scheduler run $old_run_id."
          done

      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_ARCHIVE_REPO: ${{ vars.HF_ARCHIVE_REPO }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python "合併上傳/cloud_pipeline.py" scan
