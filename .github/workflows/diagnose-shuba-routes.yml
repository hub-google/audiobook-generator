name: 有聲小說｜69書吧官方路徑測試
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'tools/diagnose_shuba_routes.py'
      - '.github/workflows/diagnose-shuba-routes.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests beautifulsoup4 curl_cffi
      - run: python -m tools.diagnose_shuba_routes
