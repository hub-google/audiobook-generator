name: "來源驗證｜九站小說實際抓文"
run-name: "【來源驗證】九站小說實際抓文｜第 ${{ github.run_number }} 次"
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/sources/**'
      - 'src/crawler.py'
      - 'src/catalog_parser.py'
      - 'tools/validate_sources_live.py'
      - '.github/workflows/source-live-validation.yml'
permissions:
  contents: read
jobs:
  source:
    name: "抓文驗證｜${{ matrix.source }}"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        source: [hjwzw, shuba69, czbooks, twkan, moon17, book8, xszj, sixk, metanovel]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests beautifulsoup4 pyyaml curl_cffi
      - run: python -m tools.validate_sources_live ${{ matrix.source }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-validation-${{ matrix.source }}
          path: source-report.json
          if-no-files-found: warn
          retention-days: 7

