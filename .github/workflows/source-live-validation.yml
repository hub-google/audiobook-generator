name: 有聲小說｜來源實際抓文驗證
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'src/sources/**'
      - 'src/crawler.py'
      - 'src/catalog_parser.py'
      - 'tools/validate_sources_live.py'
      - '.github/workflows/source-live-validation.yml'
permissions:
  contents: read
jobs:
  source:
    name: ${{ matrix.source }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        source: [hjwzw, shuba69, czbooks, twkan, moon17, book8, xszj, sixk, metanovel]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests beautifulsoup4 pyyaml curl_cffi
      - run: python -m tools.validate_sources_live ${{ matrix.source }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-validation-${{ matrix.source }}
          path: source-report.json
          if-no-files-found: warn
          retention-days: 7

  reader-architecture:
    name: reader-architecture-${{ matrix.source }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        source: [book8, moon17, twkan, czbooks, shuba69]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install playwright beautifulsoup4 requests
      - run: python -m playwright install chromium
      - run: python -m tools.inspect_reader_architecture ${{ matrix.source }}
