name: AUDIO External Service Read-only Verification
on:
  push:
    branches: [main]
    paths:
      - 'tools/live_service_check.py'
      - '.github/workflows/audio-live-service-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: audio-external-check
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip}
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check HF archive, YouTube OAuth, and original TTS/MP4 production
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_ARCHIVE_REPO: ${{ vars.HF_ARCHIVE_REPO }}
          YOUTUBE_CLIENT_ID_1: ${{ secrets.YOUTUBE_CLIENT_ID_1 }}
          YOUTUBE_CLIENT_SECRET_1: ${{ secrets.YOUTUBE_CLIENT_SECRET_1 }}
          YOUTUBE_REFRESH_TOKEN_1: ${{ secrets.YOUTUBE_REFRESH_TOKEN_1 }}
          YOUTUBE_EXPECTED_ACCOUNT_COUNT: "1"
        run: python -m tools.live_service_check
