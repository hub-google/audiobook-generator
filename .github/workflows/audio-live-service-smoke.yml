name: "外部服務驗證｜HF、YouTube、語音與影片"
run-name: "【外部服務驗證】HF、YouTube、語音與影片｜第 ${{ github.run_number }} 次"
on:
  push:
    branches: [main]
    paths:
      - 'tools/live_service_check.py'
      - '.github/workflows/audio-live-service-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: audio-external-check
  cancel-in-progress: true
jobs:
  verify:
    name: "檢查外部服務及影音製作"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip}
      - name: "安裝執行環境"
        run: pip install -r requirements.txt
      - name: "安裝影音處理工具 FFmpeg"
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: "檢查 HF 資料、YouTube 登入及語音影片製作"
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_ARCHIVE_REPO: ${{ vars.HF_ARCHIVE_REPO }}
          YOUTUBE_CLIENT_ID_1: ${{ secrets.YOUTUBE_CLIENT_ID_1 }}
          YOUTUBE_CLIENT_SECRET_1: ${{ secrets.YOUTUBE_CLIENT_SECRET_1 }}
          YOUTUBE_REFRESH_TOKEN_1: ${{ secrets.YOUTUBE_REFRESH_TOKEN_1 }}
          YOUTUBE_EXPECTED_ACCOUNT_COUNT: "1"
        run: python -m tools.live_service_check
      - name: "免費額度已確認時實際驗證 Cloudflare 封面生成"
        if: ${{ vars.CLOUDFLARE_WORKERS_FREE_CONFIRMED == 'true' }}
        env:
          COVER_IMAGE_PROVIDER: cloudflare
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_WORKERS_FREE_CONFIRMED: ${{ vars.CLOUDFLARE_WORKERS_FREE_CONFIRMED }}
        run: python -m tools.cover_provider_probe
      - name: "記錄 Cloudflare 免費額度驗證未啟用"
        if: ${{ vars.CLOUDFLARE_WORKERS_FREE_CONFIRMED != 'true' }}
        run: echo "Cloudflare image generation NOT tested (free quota confirmation missing)."
      - name: "封面測試成果（不含任何金鑰）"
        if: ${{ success() && vars.CLOUDFLARE_WORKERS_FREE_CONFIRMED == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: audio-cloudflare-free-cover-smoke
          path: cloudflare-cover-probe.jpg
          if-no-files-found: error
          retention-days: 3
