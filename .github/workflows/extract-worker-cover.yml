name: Extract worker cover preview

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download worker and publish only its cover
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          artifact_id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100" --jq '.artifacts[] | select(.name == "video-worker-0") | .id')
          test -n "$artifact_id"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > "$RUNNER_TEMP/worker.zip"
          mkdir "$RUNNER_TEMP/worker"
          unzip -j "$RUNNER_TEMP/worker.zip" '*/Cover/master_cover.jpg' -d "$RUNNER_TEMP/worker"
          cover=$(find "$RUNNER_TEMP/worker" -type f -name 'master_cover.jpg' -print -quit)
          test -n "$cover"
          cp "$cover" "$RUNNER_TEMP/master_cover.jpg"
          git config user.name github-actions
          git config user.email github-actions@github.com
          git checkout --orphan codex/cover-preview-31962500241
          git rm -rf .
          cp "$RUNNER_TEMP/master_cover.jpg" master_cover.jpg
          git add master_cover.jpg
          git commit -m "Publish worker cover preview"
          git push origin HEAD:refs/heads/codex/cover-preview-31962500241 --force
