name: 有聲小說｜三站專項架構診斷
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'tools/diagnose_remaining_sources.py'
      - '.github/workflows/diagnose-remaining-sources.yml'
permissions:
  contents: read
jobs:
  inspect:
    name: ${{ matrix.source }}
    runs-on: ubuntu-latest
    timeout-minutes: 4
    strategy:
      fail-fast: false
      matrix:
        source: [czbooks, moon17, book8]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests beautifulsoup4
      - run: python -m tools.diagnose_remaining_sources ${{ matrix.source }}
